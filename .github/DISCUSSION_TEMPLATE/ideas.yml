title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are how Overalls gets better. Please search [existing ideas](https://github.com/ghuntley/overalls/discussions/categories/ideas) first and upvote one if it already covers yours.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what's painful? Focus on the problem rather than a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you've considered, including Nix overlays in your fork.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to help build this.
