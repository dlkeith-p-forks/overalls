name: "build and publish: cache"

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-cache-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

permissions:
  contents: read

jobs:
  # Repository-wide gates: prek hooks (Python ruff/ty, HLDD receipts, conflict
  # markers, structured-event logging), the ADR checker and contract checks.
  gates:
    runs-on: namespace-profile-cached-amd64-xl
    timeout-minutes: 60
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-paths: |
            ~/.cache/prek
      - name: Install contract tooling
        run: devenv shell -- npm ci --prefix tools/code-contracts --ignore-scripts
      - name: prek
        run: devenv shell -- prek run --all-files --show-diff-on-failure
      - name: ADRs
        run: devenv shell -- elixir scripts/check_adrs.exs
      - name: Contracts
        run: |
          devenv shell -- node scripts/check_contracts.mjs coverage
          devenv shell -- node --test scripts/test/check_contracts_test.mjs

  # Each Elixir project's `mix precommit` gate against the devenv PostgreSQL.
  precommit:
    runs-on: namespace-profile-cached-amd64-xl
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        project: [protocol, marshall, lilly, audi, brady, ziggy, porsche, galileo, enrico]
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
      # Each service keeps its fetched deps and compiled _build (including the
      # Dialyzer project PLT); Hex, Mix (core PLTs) and rebar3 caches are shared.
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cache-paths: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
            ~/.mix
            ~/.hex
            ~/.cache/rebar3
      - name: Install contract tooling
        run: devenv shell -- npm ci --prefix tools/code-contracts --ignore-scripts
      - name: Start PostgreSQL
        run: |
          devenv up --detach postgres
          for _ in $(seq 1 60); do
            if devenv shell -- pg_isready -q; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: mix precommit
        working-directory: ${{ matrix.project }}
        run: devenv shell -- bash -euo pipefail -c 'mix deps.get && mix precommit'
      - name: Verify precommit left no changes
        run: git diff --exit-code

  # Builds every CI-enabled flake check that is not a NixOS machine test
  # (meta.ci, nix/verification/tests/ci.nix) and publishes it to Cachix.
  # Machine tests run in nixos-machine-tests.yml.
  nix:
    runs-on: namespace-profile-cached-amd64-xl
    timeout-minutes: 180
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
      - uses: ./.github/actions/devenv
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          install-devenv: "false"
      - name: Select checks
        id: select
        run: |
          checks=$(nix eval --raw .#checks.x86_64-linux --apply 'cs: builtins.concatStringsSep " " (builtins.filter (n: cs.${n}.meta.ci.enable && !cs.${n}.meta.ci.machine) (builtins.attrNames cs))')
          echo "Selected: $checks"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
      - name: Build checks
        env:
          CHECKS: ${{ steps.select.outputs.checks }}
        run: |
          targets=()
          for check in $CHECKS; do targets+=(".#checks.x86_64-linux.$check"); done
          nix build -L --no-link --keep-going "${targets[@]}"
