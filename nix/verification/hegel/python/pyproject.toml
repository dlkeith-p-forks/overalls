[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "overalls-hegel"
version = "0.43.7"
description = "Hegel (libhegel) Python frontend for the NixOS test driver"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["hegel*"]

[tool.setuptools.package-data]
hegel = ["py.typed"]
