[package]
name = "overalls-vscode-web-broker"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

[dev-dependencies]
proptest = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
