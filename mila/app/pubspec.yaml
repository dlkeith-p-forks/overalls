name: mila
description: "Mila: the Overalls client for iOS, Android and Linux."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  mila_core:
    path: ../packages/mila_core
  mila_transport:
    path: ../packages/mila_transport
  webview_flutter: ^4.14.1
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Material supplies widgets only; no Material icon font is shipped (ADR-0226).
  uses-material-design: false
  generate: true
  # The fonts' SIL Open Font License notices travel with the fonts; main.dart
  # registers them with the licence registry.
  assets:
    - assets/fonts/jetbrainsmono-OFL.txt
    - assets/fonts/noto/noto-mono-OFL.txt
    - assets/fonts/noto/noto-arabic-OFL.txt
    - assets/fonts/noto/noto-devanagari-OFL.txt
    - assets/fonts/noto/noto-bengali-OFL.txt
    - assets/fonts/noto/noto-telugu-OFL.txt
    - assets/fonts/noto/noto-tamil-OFL.txt
    - assets/fonts/noto/noto-symbols-OFL.txt
    - assets/fonts/noto/noto-cjk-OFL.txt
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono-500.ttf
          weight: 500
        - asset: assets/fonts/jetbrains-mono-500-italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/jetbrains-mono-600.ttf
          weight: 600
        - asset: assets/fonts/jetbrains-mono-800.ttf
          weight: 800
    # Script fallbacks behind JetBrains Mono (ADR-0207): the upstream bytes
    # Marshall's font manifest pins, linked into the gitignored assets/fonts/noto
    # by devenv and copied there by the Nix builds. MonoScale.fontFamilyFallback
    # lists them in this order.
    - family: Overalls Noto Mono
      fonts:
        - asset: assets/fonts/noto/noto-mono.ttf
    - family: Overalls Noto Arabic
      fonts:
        - asset: assets/fonts/noto/noto-arabic.ttf
    - family: Overalls Noto Devanagari
      fonts:
        - asset: assets/fonts/noto/noto-devanagari.ttf
    - family: Overalls Noto Bengali
      fonts:
        - asset: assets/fonts/noto/noto-bengali.ttf
    - family: Overalls Noto Telugu
      fonts:
        - asset: assets/fonts/noto/noto-telugu.ttf
    - family: Overalls Noto Tamil
      fonts:
        - asset: assets/fonts/noto/noto-tamil.ttf
    - family: Overalls Noto Symbols
      fonts:
        - asset: assets/fonts/noto/noto-symbols.ttf
    - family: Overalls Noto CJK
      fonts:
        - asset: assets/fonts/noto/noto-cjk.otf
