name: mila_transport
description: Mila's Porsche SSH transport, device keys and host trust, in pure Dart.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  # dartssh2 4.1.0 with Mila's host-certificate patch, built by the Nix
  # overlay in nix/platform/dartssh2.nix and linked here (ADR-0227).
  dartssh2:
    path: .nix/dartssh2
  ffi: ^2.2.0
  mila_core:
    path: ../mila_core
  pointycastle: ^4.0.0

dev_dependencies:
  hegel: ^0.3.0
  lints: ^6.0.0
  test: ^1.31.0
