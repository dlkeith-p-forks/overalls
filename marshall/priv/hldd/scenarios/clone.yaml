boundary: Snapshot ownership, audit and current requester authority, serialized publication/cancellation,
  immutable snapshot, source restoration and independently proven cleanup.
denial: Refuse withdrawn manager actions and queued activation, changed request inputs, cancelled retries
  and cancellation after publication; retain unknown cleanup holds. Retain transfer slots until both endpoint
  revocation receipts; retain the source snapshot hold, the source exclusion and the prune offer through
  cleanup uncertainty and past the cleanup deadline; refuse stale recovery over newer source intent. Malformed
  clone control JSON receives a permanent 400 invalid_message before host state changes. Reject a clone
  or relocation claim while the host transfer slot is occupied.
