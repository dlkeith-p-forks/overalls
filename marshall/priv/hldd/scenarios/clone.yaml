gaps: The cited native audit does not establish all image profiles and every cross-host failure permutation.
  On 2026-09-26 a fresh production clone recovered through supported retry and its independent copy relocated
  in both directions. The original older clone disappeared externally before recovery. Isolated native
  owned-staging recovery passed; full native reruns and clean production clone acceptance of that repair
  remain pending. Published upstream recovery retains separate generated and recorded native evidence.
  The fourth capture passed physical cancellation recovery, then failed automatic owner-clone completion
  after source disk_not_ready. The fifth stopped on a nonterminal capture_unconfirmed progress label before
  cancellation; its earlier native error is unknown. The bounded oracle now binds retry labels to offered
  incomplete effects, valid phases and retained commitments, while requiring the successful exact capture
  receipt and native GUID before proceeding. The sixth confirmed capture but failed source restart with
  disk_not_ready before cancellation. The seventh identified pool_observation with incoherent_zfs_observation
  before cancellation. Deeper finite diagnostics distinguish identity/read/stability failures from bounded
  accounting exhaustion without changing any guard; exact native causality remains unproven. Complete
  ordinary single-disk acceptance remains pending; all nine failed captures retain their scopes. Inception
  validation is excluded. The integrated candidate preserves published 951630ee recovery and adds a bounded
  private public-property recorder; the eighth instrumented run failed queued activation with source_unavailable
  before physical capture. Six complete successful reads were privately collected without readiness context.
  Offline disposable-DB recovery identified the refusal and stale retained telemetry at completion, but
  cannot prove the exact activation-time conjunct. The fixture waits for actual post-startup fresh receipts
  and settled operations before one coordinator call. The ninth capture failed initial admission before
  source creation or that activation wait, with 31 invalid_report execution refusals; private recovery
  retained three accepted reports with valid host/storage identities and no VM or clone. Rejected report
  bodies and the validation clock are absent, so their exact failing predicate and overload causality
  remain unproven. Activation-wait execution and complete cancellation/control acceptance remain pending.
  Instrumented timing is not performance acceptance. Fixture-only guard-stage and signed-age diagnostics
  preserve validation and rollback, but await native execution. First rejection per stage/replica provides
  no host-attributed timeline and cannot retrospectively classify run13. The published staging-identity
  boundary repair's recorded full native zfs-guest journey and the 1487.16-second prepared-receive cloning-fleet
  pass retain their separate scopes; its deployment and renewed production acceptance are now recorded
  in the recovery review. Local generated transfer-slot evidence does not establish independent-process
  races or physical stream cessation before release. ADR-0149 retires diagnostic ingestion/outbox/presentation;
  pre-cutover evidence is historical. Replacement native/property acceptance must execute separately.
id: clone
journey: Clone a machine without sharing its mutable disk
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Diagnose the refused admission reports at their actual guard, then run the bounded capture/cancellation
  journey and unchanged automatic clone control; extend native profile/interruption coverage independently.
  Synthetic receipts establish only coordinator behavior. Execute the replacement independent-observability
  native and property scenarios; historical receipts cannot establish this cutover.
scope: Recorded generated actual-action histories and five three-independent-BEAM orderings; existing
  native copy evidence retains its scope and the new browser cancellation journey records runtime separately.
  Independent upstream histories and native owned-staging evidence retain their recorded scope. The 2026-09-26
  clone matrix adds generated profile/size/image-churn histories with source-row comparators, Ash-pinned
  OSS/customer retention, power and refusal classifications, and new native clone matrix and failure-permutation
  checks.
status: partial
