  record_assertion: 'Focused suite passed: 25 checks (2 properties, 23 tests), seed 994664'
  scope: Generated rename/remove/verify/lock/register/revoke histories for administrator and ordinary
    accounts against the real action, with an independent model of login liveness, elevation, labels,
    MFA generation, challenges and token presence; refused steps require byte-identical passkey, verification,
    token, challenge and audit rows.
