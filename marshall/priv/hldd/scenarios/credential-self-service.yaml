boundary: Live stored login and five-minute passkey elevation gate rename/remove through the locked account
  row; labels are bounded to 80 characters; accounts hold at most ten passkeys and one hundred SSH keys.
denial: Missing, blank or over-length labels, stale or signed-out sessions, unknown credentials, an administrator's
  last passkey, limit overflow and consumed challenges refuse; every refusal leaves the complete passkey,
  verification, token, challenge and audit inventory byte-identical.
