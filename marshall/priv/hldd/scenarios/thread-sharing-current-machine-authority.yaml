boundary: Threads owns canonical viewer/operator/manager grants and immutable sharing results. Current
  thread grants contribute to the current matching-owner VM binding through existing Cedar authority;
  no VM grant is copied. Independent VM/team grants remain additive. Terminal, editor, SSH and personal
  guest-account authorities remain separate.
denial: Refuse unregistered or retired recipients, protected-owner edits, web-only thread roles, unauthorized
  recipient enumeration, viewer prompts/writes, operator thread management, changed idempotency input
  and stale request regrant. VM-only grants do not expose task transcripts. Foreign-owner, retired or
  Customer bindings do not inherit thread grants. A role cannot grant another user's personal shell or
  bypass current login, execution or profile checks. Thread revocation removes only that authority source;
  independent VM/team access may remain.
