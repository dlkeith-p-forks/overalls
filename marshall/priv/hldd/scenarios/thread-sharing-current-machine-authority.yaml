  closure, guest isolation or personal-session refusal. A thread manager can intentionally delegate independent
  machine access, whose lifetime is separate from thread revocation.
id: thread-sharing-current-machine-authority
journey: Share a thread and use its current work machine
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Add generated lock/replay/revocation histories and a NixOS create/share/use/revoke/archive/reopen
  journey across multiple Marshall instances. Exercise existing personal-shell refusals and surviving
  independent VM/team grants while terminal, editor and SSH sessions are active.
scope: The focused 117-case suite passed on 2026-10-16, including two properties and 115 tests. Its database-backed
  cases cover the role matrix, immutable replay, pending/archive/reopen continuity, scoped recipient lists,
  current machine visibility, additive source revocation, stale binding refusal, guest roster candidates
  and retired-account cleanup. The maintained browser probe passed 36 collaborator role/state/theme/viewport
  combinations, live viewer revoke/restore and unrelated-account refusal on synthetic fixtures. Existing
  production thread recovery and historical machine-sharing acceptance do not establish this new cross-domain
  grant path.
