  nine-module/764-entry/schema/network checks, read-only receipt extraction and clean shutdown, sealing
  disk a49255bd. A paired direct-only QEMU diagnostic reaches console login on 76b8 under identical no-vsock
  settings where 9853 panics mounting root; growth enters maintenance, so corrected Firecracker services/transport/reset
  and original ZFS EIO causality remain separate. The first corrected-image Firecracker service run stays
