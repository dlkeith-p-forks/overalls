boundary: The v6 image and v3 workload bundle carry immutable kernel provenance. Lilly uses the caller-owned
  jail-local /v.sock and a fixed probe port to compare the native OS, placement, execution epoch, boot
  challenge and kernel digest, requiring a canonical boot ID before credentials or readiness. Readiness
  must return the same boot ID. Native source receipts and placeholder kernels remain outside fleet admission;
  unqualified native capabilities remain false. Separate complete exact-image qualification enables only
  the reviewed sealed FreeBSD and exact OmniOS native subsets; changed or unreviewed candidates remain
  closed.
denial: Refuse incomplete provenance, unavailable or placeholder kernel artifacts, malformed or oversized
  probe frames, stale boot identity and digest mismatch. Wrong-CID frames must be refused by the native
  kernel decoder; FreeBSD has recorded fault-kernel machine evidence, OmniOS does not.
