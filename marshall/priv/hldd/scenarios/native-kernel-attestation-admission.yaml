gaps: Corrected OmniOS policy, supervised-daemon-recovery and isolation evidence remain required; current
  native service, growth and crash replays are recorded separately. Wrong-CID injection, DMA/socket lifetime,
  reset, direct native peer-VM/jail/host isolation and integrated fleet admission remain open. FreeBSD
  and OmniOS process-SIGKILL evidence does not establish physical stable-media or host power-loss durability;
  OmniOS capabilities remain false; exact sealed FreeBSD activation is recorded separately. OmniOS Nix
  KVM assembly reproduces its receipt and unchanged module bytes but not its raw disk; an intermittent
  OmniOS SSH poweroff timeout at shutdown-send is undiagnosed.
id: native-kernel-attestation-admission
journey: Keep native FreeBSD and illumos admission closed until kernel identity and boot evidence exist
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Run the exact OmniOS policy, supervised daemon-recovery and wrong-CID/reset variants under
  Firecracker, bind each result to the current image/kernel/VMM provenance, then add direct peer isolation
  and fleet admission only after those receipts pass.
scope: Protocol/Lilly units cover closed schemas and stale framing through local sockets. Original candidate
  receipts retain false admission; the separate exact-image-qualified-admission scenario records activation
  of only the sealed reviewed FreeBSD image. Lyra compares a read-only executing transport token with
  a bounded root-owned expected file and separately hashes the kernel file. FreeBSD two-boot candidate
  assembly checks actual installed bytes/Git/trust and executing sysctl identity. A scoped 139-second
  nested-KVM run checked the actual FreeBSD socket token/CID2/3, native ABI refusals, oversized/disconnected
  refusal/recovery and nine exact echo sizes through 1 MiB. Corrected illumos objects passed native nine-module
  link/install, QEMU file/runtime checks and seven native helper safety tests. The seed-fixed clean-export
  OmniOS candidate then passed the complete executing-AF40 verifier and native Rust token/CID2/3/refusal/nine-size
  transport checks under Firecracker with a debugger-only stock pseudo_isa override. The assembler now
  binds persistent pseudo ISA and serial configuration; exact final-image replay remains required. The
  final reviewed FreeBSD image 5022d714 passed all five native variants with actual current-boot kernel
  responses, complete per-boot service oracles and exact image/kernel/firmware/VMM receipts. Linux shared-core
  properties and extracted listener harnesses retain model scope. A separate exact test-only FreeBSD probe
  passed one actual pause/full-snapshot/resume transport event, fencing idle identity and pending socket
  calls; its formal repeatable nested-KVM gate passed in 232 seconds with exact immutable receipts. The
  earlier 9853 illumos static-lifetime/direct-budget build passed all 26 objects and three host-test gates,
  then native nine-module linkage and 764-entry clean-export assembly with three native SMF validations
  and four exact stock-network removals. The sealed disk 24318238 first service/ordinary/reset attempts
  failed in early boot with blank serial and Firecracker Shutdown(GenericError), before fixtures, native
  probes or reset API calls; no cause or runtime success is established. The current source-qualified
  OmniOS test image subsequently passed two complete native service boots with current-boot identity,
  trust, flush, workspace, terminal, SSH and executor-fencing checks; its patched VMM requires status
  zero and the bounded syncing file systems... done marker for clean shutdown. Its separate crash receipt
  records observed SIGKILL, fresh MMDS/boot identity, stale-authority refusal, exact retained bytes, completed
  zero-error ZFS scrub and clean shutdown. The final ordinary FreeBSD catalog transport gate separately
  passed in 246 seconds on exact image 19658a4a, preserving the ordinary/reset/service image distinctions.
  The completion-corrected 76b8c1ad build passed all 26 objects and four host gates, including 161 five-function
