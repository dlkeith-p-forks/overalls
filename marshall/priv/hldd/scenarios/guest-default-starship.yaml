boundary: Existing boot-bound roster reconciliation owns managed identity, home and executable Bash; global
  image startup enables interactive Starship with the stock NixOS TERM=dumb skip. Ubuntu initializes interactive
  Bash even with TERM=dumb. Browser and SSH retain existing admission authority.
denial: Missing or non-executable distribution Bash refuses reconciliation before account/state mutation.
  Noninteractive command output receives no prompt noise; retired or foreign accounts retain existing
  login refusal.
