boundary: Machine pages (overview, list, pinned section, get, resolve) read through Compute.Views in one
  outermost REPEATABLE READ, READ ONLY transaction. Inside it the persisted Cedar principal, owners, grant,
  thread and team rows, entities and projection rows are read once or in identical batches and dropped
  when the transaction ends; Cedar still evaluates every row. Nested in another transaction nothing is
  reused.
denial: Omit any machine a fresh per-row read decision refuses, project the same read/write/manage
  permissions fresh decisions return, hide a revoked machine on the next read, and never reuse a read
  across refreshes, requests or processes.
