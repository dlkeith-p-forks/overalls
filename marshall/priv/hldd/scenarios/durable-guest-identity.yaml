boundary: A User UUID owns one durable GuestAccount UUID and never-reused UID; exact u<uid> login, /home/u<uid>
  home and editor origin are independent of email. Current login, Cedar write authority and boot/execution
  fences still gate every access. Retired identities remain permanent reservations.
denial: Refuse retired users, inherited authority for fresh same-email registrations, invalid canonical
  database names, duplicate reservations, oversized batches and noncycling UID exhaustion; historical
  database restore with newer retained disks is unsupported until reservations and sequence reconcile.
