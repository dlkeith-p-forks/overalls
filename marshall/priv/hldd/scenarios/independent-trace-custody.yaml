boundary: Per-producer Unix UID/cgroup identity and private SQLite FULL-WAL archive determine diagnostic
  custody; the observer holds no application or guest authority.
denial: Wrong UID or exact unit refuses even with socket-group access; quota and malformed input cannot
  evict acknowledged archive bytes; unavailable observers cannot stop producer work.
