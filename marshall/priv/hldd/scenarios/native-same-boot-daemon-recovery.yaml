boundary: Actual managed SSH observes the root-owned flush marker, executable mode/hash and live PID.
  Within one boot the oracle kills/reaps that process while executable permission prevents restart, then
  restores exact mode and requires a different supervised PID with the same bytes and boot identity.
denial: Require three refusals over the still-live readiness channel while the flush daemon cannot restart.
  Refuse malformed snapshot/mode/PID/hash framing and incomplete restoration; only the full sequence may
  publish a receipt.
