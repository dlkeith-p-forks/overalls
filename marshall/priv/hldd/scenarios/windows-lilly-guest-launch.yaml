gaps: 'Agentless launch is recorded. C: growth after a host-side extension and timekeeping under load
  remain unobserved; the host reachability probe is a test-only policy allowance, not a product path or
  Marshall observation. Agent trust/readiness, terminal, workspace, roster and executor coverage belongs
  to the windows-v1 scenario. Independent-host recovery and a repeatable Marshall-driven Windows matrix
  remain unverified.'
