scope: 'Protocol unit and property tests pin independent identity vectors for both manifest versions and
  the byte-identical version-1 bundle encoding; Lilly tests pin the kernel jail configuration and unit
  arguments unchanged and check the firmware variants, lifecycle edges (unattested, skipped) and firmware
  image loading; Marshall tests cover the capability property, admission refusal, service-level admission
  and hidden controls. The revised admission unit test passed within the focused run on 2026-10-19: agentless
  Git capability refusal allocates nothing; a Git-capable windows-v1 image admits physical and readiness
  measurements with its own budget. The retained pre-identity fixture checks physical-only measurement
  in its sandbox; this BEAM admission evidence does not update native launch acceptance. The windows-lilly-guest
  machine test drives the real Lilly driver on nested KVM: Inception refusal before any dataset, firmware
  bundle on the dataset with sparse usage, skipped trust and unattested provisioning from the journals,
  SAC> on the boot log, the guest''s bootstrap log and applied identity read from the EFI system partition
  of the live disk without a login, ICMP and TCP 22 on the delivered /32 from Lilly''s network namespace
  through a test-only accept for that address in the host policy (the tap guard stays intact and its accept
  counter is asserted), restart from the portable bundle without the image, stop and delete. Recorded
  on 2026-10-14: the windows-lilly-guest test passed end to end on nested KVM (2688 s).'
