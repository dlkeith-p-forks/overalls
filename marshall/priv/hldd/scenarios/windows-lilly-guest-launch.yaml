boundary: The protocol admits exactly the eight-key version-5 manifest and the seven-key version-2 firmware
  bundle beside the unchanged version-4 and version-1 shapes; artifact names come from the protocol only.
  Lilly keeps rootfs.ext4 as the pool-side root slot, bind-mounts the firmware read-only, seeds the boot
  identity (placement, execution epoch, boot challenge, /32, gateway, MAC; never the generation) into
  Firecracker's MMDS from a root-owned jail-local metadata.json before launch, boots /firmware with the
  Hyper-V CPU template and --enable-pci, and runs the guest under the jailer, seccomp observation and
  the per-tap guard. The guest's SYSTEM bootstrap task reads MMDS with a V2 session token, validates every
  field including the adapter MAC and applies exactly the delivered /32. Marshall projects per-capability
  guest facts (guest_capabilities) from the immutable image, all service capabilities false for the agentless
  set.
denial: 'A bundle with guest_agents none never reports guest_ready: trust is recorded as skipped for the
  exact boot, provisioning ends in the terminal unattested phase (no boot UUID, no path to ready), and
  readiness, terminal options, workspace sources and the Inception profile are refused before any host
  effect. Marshall refuses terminal sessions, agent turns, the agent executor binding, web search and
  Inception admission for such an image, hides the corresponding controls, and refuses new machine admission
  with git_identity_unavailable because agentless manifests cannot advertise the Git identity capability
  required by ADR-0198/0204. Physical-only measurement remains relevant to retained executions and the
  historical Lilly-only fixture. New admissions without Git identity support refuse with no allocation
  effects. An older Lilly fails closed on a firmware bundle, which is why the converged push precedes
  any placement. Lilly''s host policy drops every unmarked packet between the host and a Customer guest,
  so nothing on the host reaches the Windows guest except the SSH and editor ingress paths it does not
  yet have. The guest bootstrap refuses an MMDS document whose fields fail validation or whose MAC is
  not the adapter''s and never logs the token or boot challenge.'
