gaps: No generic automated reconciliation makes a historical database authoritative for surviving guests;
  physical replacement GUID adoption needs operator reconciliation.
id: backups
journey: Restore selected host state and encrypted application data
layers:
- storage
- recovery
preferred_gap: Native TLS/ZFS/database/keyring and packaged-command acceptance retains its original scope.
  Local generated command histories cannot establish physical replacement GUID adoption or historical-authority
  reconciliation; those require explicit operator and native disaster-recovery drills.
scope: Recorded native database/keyring recovery, plus generated public-runtime manifest/reference, host-lock
  and isolated partial-restore histories against local encrypted Restic; the documented repository-password
  key ceremony with its zero-failure overlap, the exact repository-label wedge after rotation without
  it and its previous-generation recovery, and restore→decrypt→repository-access composition with the
  historical-generation refusal in synthetic fixtures.
