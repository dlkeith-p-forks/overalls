preferred_gap: Reproduce and identify the intermittent broker-restart502 without changing default capacity,
  deadlines or recovery/refusal assertions. Qualify later merged releases separately and add owned production
  browser fixtures without fabricating operator session authority.
scope: The shared Alma/Arch builder packages the pinned editor/broker/direnv, exact descriptor, registered
  offline closure and GC roots. Final evaluation and actual-filesystem custody gates passed, along with
  two exact-release/image property and absent-descriptor checks. Alma's isolated nine-node nested-KVM
  suite passed all twelve provisioning, editor/terminal/webview, policy, recovery, restart and current-authority
  subtests. Its fixture image90eca504 differs from production65e7700b by private roots and policy files.
  Both production Arch0b3da3e8 and Alma65e7700b passed fresh strict personal CLI SSH, stop/checkpoint/restart,
  repeated SSH and owned deletion, plus four PAM/sudo smokes. Arch's captured same-image diagnostic replay
  passed all twelve native stages in618.2s; the earlier broker-restart502 remains unexplained. Both native
  sources precede the later trunk merge. No current-revision NixOS or Ubuntu native browser sign-in, edit/save/readback
  and recovery receipt is recorded here.
