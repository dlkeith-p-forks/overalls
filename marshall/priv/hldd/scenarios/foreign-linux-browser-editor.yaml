boundary: The immutable image binds the pinned editor/broker closure and exact descriptor; Marshall retains
  current write/profile/Customer-owner authority, Audi retains the account origin, Lilly fences TCP 4444
  to the current boot, and the guest broker reconciles the current personal UID before launching a systemd
  worker.
denial: Retained editor-free images, a changed release or image identity, missing package partner, insufficient
  headroom, unsafe customization paths, foreign gateway/boot/account and revoked browser authority must
  refuse. A Linux family capability or successful SSH does not grant editor authority.
