boundary: Official-source Nix package and broker bind exact boot address/gateway, execution/release/account
  preface and reconciled UID. Systemd worker/socket ownership is independent of the root broker.
denial: Reject foreign gateway, epoch, placement, release, account or username before worker startup.
  Never start an editor as root or inherit another account's home. Unchanged identity preserves a live
  worker; changed legitimate origin/release requires successful stop before replacement. Metadata or foreign
  socket custody failure refuses without stopping it; files remain retained.
