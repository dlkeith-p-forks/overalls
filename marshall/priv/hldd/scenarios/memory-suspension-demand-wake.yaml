id: memory-suspension-demand-wake
journey: A thread machine suspends after four tool-idle hours and resumes its memory on a prompt or authorized
  SSH, web or editor connection, relocating automatically when its host is full
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Run the memory-suspension-fleet NixOS check and record exact-source RAM/cgroup/connection
  evidence; separately qualify each native image before enabling its checkpoint operations.
scope: Ash state machines and Hegel histories exercise BEAM admission, timer boundaries, coalescing and
  execution fences. Native hostd tests cover API-only restore launch and fixed checkpoint stream derivation.
  The fleet fixture now uses ordinary Galileo/Audi private-issuer, runtime-credential and trust enrollment
  without bypassing guest readiness. Its composed driver passed type and lint checks; the subsequent native
