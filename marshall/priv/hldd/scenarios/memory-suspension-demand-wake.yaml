boundary: Current Cedar/key/publication/editor authority admits coalesced durable wake only; compute and
  private checkpoint capacity, sealed same-boot continuation, single-use restore and destination relay
  consumption independently fence execution.
denial: Foreign or revoked authority, missing/corrupt/incompatible checkpoints, replayed restore and arbitrary
  relay targets refuse. Network activity cannot override explicit stop intent; a user prompt or explicit
  start may start a stopped VM. Full compatible-fleet capacity leaves wake pending; it never cold boots
  to replace memory.
evidence:
- assertion: pause releases execution and resume preserves RAM, PID and boot UUID
  execution: present
  kind: machine
  path: nix/verification/tests/machines/fleet/scenarios/suspension.py
  scope: The NixOS test definition asserts real Firecracker lifecycle and repeated same-memory continuation,
    running and paused relocation, and original waiting SSH/HTTPS/editor connections. Presence does not
    record a successful run.
- assertion: idle deadline is exactly four hours and opt-out never expires
  execution: present
  kind: property
  path: marshall/test/marshall/compute/suspension_test.exs
  scope: Application policy, serialized durable idle timing and synthetic outcome accounting; no physical
    RAM continuity.
- assertion: paused terminal retries coalesce only after current authorization
  execution: present
  kind: property
  path: marshall/test/marshall/terminal/authority_test.exs
  scope: Generated allowed/foreign histories prove no premature terminal session creation while waiting
    for wake.
- assertion: a failure cannot finish demand without its exact relocation association
  execution: present
  kind: unit
  path: marshall/test/marshall/compute/wake_relocation_failure_test.exs
  scope: Ash/PostgreSQL fixtures distinguish an exact committed relocation failure from uncommitted or
