    physical restore or transfer.
- assertion: origin loses wake and relay authority
  execution: present
  kind: unit
  path: marshall/test/marshall/ingress_wake_test.exs
  scope: Local current-origin authority fixtures refuse new wake, relay consumption and renewal after
