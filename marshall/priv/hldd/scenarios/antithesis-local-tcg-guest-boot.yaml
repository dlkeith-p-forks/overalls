boundary: A local QEMU TCG runner boots the production NixOS guest services in a q35-adapted image. The
  port 1024 readiness response is checked exactly; the same qcow2 overlay is reused across a stopped restart,
  and retained machine-id bytes are inspected offline. Runner process identities and TAP cleanup bound
  the local fixture.
denial: The initial q35 image reached multi-user and answered port 1026 flush but did not report readiness
  when its NIC appeared as enp0s3; the net.ifnames=0 repair allowed the exact readiness check. A flush
  reply alone cannot authorize readiness, and an emulator boot cannot authorize hosted Lilly placement
  or native physical effects.
evidence:
- assertion: Exact port 1024 readiness and port 1026 flush succeeded
  execution: recorded
  kind: manual
  path: antithesis/verification/guest-boot.md
  record: docs/architecture/reviews/2026-10-13-antithesis-harness-foundation.md
  record_assertion: TCG guest boot record passed exact port 1024 readiness at epochs 3, 4 and 5
  scope: Local QEMU TCG boot, same-overlay restart and offline retained-disk inspection; the JSON record
    binds exact image, runner, tools and source identities. No Lilly callback, native KVM/Firecracker/ZFS
    or hosted run.
gaps: Default hosted Lilly still refuses guest effects, while the optional integrated GuestExecutor has
  no composed journey. A separate inner-host TCG boot measured ZFS/cgroups but did not connect Control
  or admit a guest. No workspace delivery, Firecracker/KVM, physical isolation or hosted baseline is established
  by this guest boot. The router has a separate local TCG result. This manual check lacks preferred NixOS
  machine/property evidence for the integrated guest bridge.
id: antithesis-local-tcg-guest-boot
journey: Boot a disposable NixOS guest in the local Antithesis emulator and retain its disk identity across
  restart
layers:
- execution
- isolation
- storage
- recovery
preferred_gap: Execute the selected integrated guest adapter with measured ownership and capacity, add
  a NixOS machine journey and generated recovery properties, then record a separate hosted execution identity.
scope: The local guest-boot record identifies the image, runner, tool configuration, source hashes and
  three ready epochs. Epoch 4 reused the qcow2 overlay; an offline read matched retained machine-id bytes,
  qemu-img check found zero errors, and owned processes/TAP were removed. The foundation review reconciles
  this passing manual software-emulator scope separately from the later passing base control-core setup;
  no integrated guest journey follows.
status: partial
