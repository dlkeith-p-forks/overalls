boundary: 'SCIM Groups create, rename, update membership and delete SCIM-managed teams owned only by the
  hidden service owner. While SCIM is enabled no native team can be created and native membership, invitation
  and ownership transfer are refused; SCIM-managed teams stay locked after SCIM is disabled. Enabling
  SCIM retires native teams: after the grace deadline their authority is revoked, machines are deleted
  through Compute and the team is archived.'
denial: Native team mutations, transfers and new team resources on retiring or SCIM-managed teams are
  refused over the web and SSH; unauthenticated or disabled SCIM Group requests are refused; the service
  owner cannot be removed or changed.
