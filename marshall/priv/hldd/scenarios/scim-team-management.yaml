gaps: Administrator handoff of SCIM-managed teams after SCIM is disabled is not implemented; directory
  groups cannot grant team roles; native team machine deletion after the deadline is BEAM-only.
id: scim-team-management
journey: An identity provider manages Marshall teams through SCIM Groups while people view their teams
  and all teams read-only
layers:
- identity
- authorization
- transport
- execution
- isolation
- recovery
preferred_gap: Implement and machine-test administrator handoff, and observe native team machine deletion
  after a shortened grace period.
scope: BEAM HTTP, Oban, LiveView and Hegel membership histories against PostgreSQL plus a NixOS machine
