boundary: Mila's ARB catalogs match the Porsche gettext locales with identical placeholders. Locales without
  a Flutter framework catalog borrow only framework strings, from Arabic or English; Egyptian Arabic,
  Arabic and Urdu lay out right to left.
denial: A missing or extra locale, a dropped placeholder or an undocumented template message fails the
  catalog tests; locale never changes command arguments or machine JSON.
