boundary: The BEAM holds only sockets it created (ADR-0184). lilly-hostd connects Lilly's own socket to
  api.sock or v.sock beneath pool roots, or, as a fallback only, bridges it to a namespace connection
  through lilly-ingress-bridge running as lilly (op 13); every ingress service instead sends Audi's accepted
  connection to a detached bridge (ADR-0187, ADR-0192). hostd sends no descriptor and Lilly closes each
  socket after its gen_tcp port is down.
denial: hostd refuses a received descriptor that is not an unconnected, non-listening AF_UNIX stream socket
  and paths outside its socket roots, and ends the session on a descriptor with any other request, a missing
  descriptor or more than one.
