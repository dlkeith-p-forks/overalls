- assertion: windows-editor-native-browser-journey
  execution: present
  kind: machine
  path: nix/verification/tests/machines/windows-editor/browser.py
  scope: Source-present actual relay/workbench, native save/PTY and broker/worker recovery harness. Static
    compilation and boundary checks do not execute Windows or authenticate a browser journey.
- assertion: prior_session_drain_never_touches_other_accounts_or_sessions
  execution: recorded
  kind: property
  path: nix/domains/artifacts/vscode-web-broker/src/windows_model.rs
  record: docs/architecture/reviews/2026-10-18-windows-editor-job-custodian.md
  record_assertion: 35 library tests passed, including 5 new recovery properties/units
  scope: Generated process tables with other accounts, other logon sessions of the same account, pre-root
    processes, unobservable entries, unreadable tokens, respawning and stubborn stragglers. Recovery succeeds
    only with zero exact-session processes and terminates only exact-session processes. Portable model
    only; no Toolhelp snapshot, token or TerminateProcess call runs.
- assertion: stale_or_current_generation_receipts_never_reach_recovery
  execution: recorded
  kind: property
  path: nix/domains/artifacts/vscode-web-broker/src/windows_model.rs
  record: docs/architecture/reviews/2026-10-18-windows-editor-job-custodian.md
  record_assertion: 35 library tests passed, including 5 new recovery properties/units
  scope: Generated current/recorded generations, identity drift and prior-job presence. Only an earlier
    generation with exact identity and a vanished job is admitted; stale generations and drift refuse
    before the job probe. Portable model only; no Job Object is opened.
gaps: Native Windows SAM/S4U/profile and executable/PATH lifecycle custody, sustained/interrupted overlapped
  cancellation, task crash/reboot supervision, exact bundle/image qualification, two-account browser separation,
  edit/readback, revocation, broker adoption and worker-loss recovery remain unrecorded. ADR-0237 same-boot
  custodian-crash recovery (durable generation, logon-session straggler termination, preservation of another
  session of the same account) has portable property evidence only; no native custodian crash has run.
  Guest administrator authority and physical isolation are separate boundaries.
id: windows-browser-editor-candidate
journey: Stage a personal Windows browser editor candidate while keeping unqualified Windows images editor-ineligible
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Run the isolated native Windows machine/browser harness against the exact reviewed bundle
  and candidate image, complete protocol and both consumer gates, then review exact production image selection.
scope: The native Code OSS source build and reviewed import completed for exact release fbd3ccab8ae104bf2aee689e77deb6e47a3e9f12b2e4cbe3eeccdaf8afcb7dfe
  with four signed extensions, product policy, licenses and native provenance checked. Focused protocol
  and Lilly tests cover immutable v7/v4 identity, release preservation and old-row refusal. Portable tests
  cover finite identity, path and capacity decisions. Thirty native Windows library tests pass, including
  actual named-pipe timeout/cancellation and Windows ACL descriptor/refusal checks; thirteen SYSTEM fixture
  cases cover installer/task custody. No admitted Windows image, Win32 listener/account/worker/task lifecycle
  or authenticated Windows browser journey is recorded.
