  scope: Actual Windows source build and exact reviewed recursive-NAR import at release fbd3ccab8ae104bf2aee689e77deb6e47a3e9f12b2e4cbe3eeccdaf8afcb7dfe.
    Validated descriptor, product policy, four signed extensions, licenses and provenance; refused links/store
    references. Build/import only, no installed image, native worker or browser acceptance.
- assertion: Linux and Windows approve distinct releases together without cross-target substitution
