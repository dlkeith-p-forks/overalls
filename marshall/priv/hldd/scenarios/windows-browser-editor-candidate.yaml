  kind: unit
  path: marshall/test/marshall/compute/image_editor_capability_test.exs
  scope: Pure validated image capability checks retain separate exact target tuples, reject swapped descriptors
    and preserve empty-registry refusal. No Windows guest, package execution or browser admission runs.
- assertion: same_account_pipe_requires_job_and_executable_custody
  execution: present
  kind: unit
  path: nix/domains/artifacts/vscode-web-broker/src/windows_model.rs
  scope: Portable modeled custody rejects a same-account pipe without exact retained job and executable
    identity; no native SAM, Job Object or pipe API runs.
- assertion: pipe_slots_remain_reserved_until_retained_operation_is_released
  execution: present
  kind: unit
  path: nix/domains/artifacts/vscode-web-broker/src/windows_model.rs
  scope: Portable slot reservations remain bounded until retained state drops; no native overlapped cancellation
