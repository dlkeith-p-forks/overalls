boundary: ADR-0200 accepts a source-built native Code OSS candidate and SYSTEM broker on dedicated gateway-only
  TCP 4444. The separate windows-editor-v1 row requires manifest v7 with a closed immutable editor descriptor;
  portable bundle v4 retains that tuple. Marshall selects only the exact win32-x64 registry descriptor
  for a validated Windows candidate, independently of the concurrent Linux tuple. Existing windows-v1/v5
  remains editor false and no production catalog selects the candidate. The candidate binds current MMDS
  execution, the closed preface, locked roster reconciliation, canonical local SAM SID and S4U token,
  personal profile, exact Job Object/process/pipe custody and a private recovery receipt.
denial: The accepted windows-v1 editor capability remains false. Missing or mismatched image descriptors,
  foreign gateway or execution, stale roster account, ambiguous package/PATH custody, wrong SID/process/job/pipe
  and exhausted pending-I/O capacity must refuse. A foreign process cannot be terminated or adopted without
  exact custody; a portable test or cross-link cannot qualify native Windows browser admission.
