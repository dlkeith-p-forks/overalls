boundary: Enrico's manager counts unique admitted terminal refreshes and exposes fixed cumulative outcomes
  and duration through its owner-only Unix health socket; Rust exports through an Enrico-only collector
  intake with Nix-owned service identity.
denial: Invalid, busy and duplicate attempts do not add outcomes; unauthenticated reads cannot access
  the mirror; ordinary Enrico UID cannot connect to the collector socket; repository labels never enter
  SLO metrics.
evidence:
- assertion: generated terminal refreshes have closed cumulative outcomes
  execution: recorded
  kind: property
  path: enrico/test/slo_test.exs
  record: docs/architecture/reviews/2026-09-28-fleet-otel-baseline.md
  record_assertion: passed a generated outcome
  scope: Generated terminal histories, fixed duration buckets and closed cumulative arithmetic.
- assertion: Rust exporter delivers Enrico-owned terminal outcomes to the isolated collector
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/enrico-service/driver.py
  record: docs/architecture/reviews/2026-09-28-fleet-otel-baseline.md
  record_assertion: the packaged service refreshed and browsed a mirror
  scope: Packaged Enrico with local Git fixture, terminal success and failure, duplicate exclusion, Rust
    OTLP export and ordinary UID collector socket refusal.
gaps: Cross-host Marshall scheduling, manager-crash accounting, production collection and a measured final
  target baseline remain open; the provisional seven-day rule consumes only the named candidate series.
id: enrico-slo-source
journey: Observe a registered mirror refresh as a candidate service level indicator
layers:
- authorization
- transport
- isolation
- storage
- recovery
preferred_gap: Exercise Marshall-to-Enrico scheduling and manager restart under native NixOS, then verify
  live collection and measure the production baseline.
scope: Generated arithmetic and packaged NixOS mirror journey covering successful, duplicate and failed
  refreshes, local Git readback, source outage, Rust export and collector socket refusal.
status: partial
