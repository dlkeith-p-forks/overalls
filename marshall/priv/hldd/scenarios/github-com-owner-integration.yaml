boundary: Marshall owns encrypted OAuth credentials and scheduled rotation; Galileo admits owner-bound
  requests at com-github.integration.internal using current execution and generation leases. Shared VM
  writers exercise the owner identity.
denial: Foreign or stale execution and generation authority cannot redeem capabilities; detach and disconnect
  withdraw authenticated admission. Guests cannot select credential recipients. Fresh anonymous requests
  carry no OAuth bearer.
