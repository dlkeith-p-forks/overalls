boundary: Marshall checks current Cedar VM read, unique current placement and fresh authenticated protocol-2
  host stream independently of guest terminal capability. Lilly checks its assigned stream caller and
  newest runnable command, then binds a private single-link host log inode to unchanged boot, intent and
  launch-attempt evidence. Only a bounded page and cursor leave the host; no guest manager, dial, boot
  challenge, path or input authority is returned.
denial: Refuse foreign or revoked readers, deleted VMs, stale or unsupported host streams, missing or
  ambiguous placement, superseded stop/delete/replacement commands, changed epoch/generation/incarnation,
  missing launch witness and unsafe files. An older same-epoch launch attempt permits only a still-running
  adopted execution with full confined-VMM observation; failed adopted logs remain unavailable. Guest
  terminal session creation/listing remains refused when capability is false.
