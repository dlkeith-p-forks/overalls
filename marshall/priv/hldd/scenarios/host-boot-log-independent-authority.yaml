preferred_gap: Run a NixOS machine/browser journey that follows Boot log while guest terminal capability
  is false, reads a known host marker and rejects revoked, superseded and restarted execution authority.
scope: Focused Lilly execution passed 55 checks (13 properties and 42 tests), including pending/failed
  current-command diagnostics, launch-witness and private-inode refusals, actor supersession and generated
  arbitrary-byte/cursor histories. Independent control-flow review found no remaining source blocker.
  The focused Marshall suite passed 27 tests covering synthetic native terminal-capability false, Cedar/freshness/protocol
  refusal, the direct Boot log link and diagnostic mode without guest listing or automatic opening. Structural
  Monospace, presentation JavaScript and Python static gates also passed. The final local browser fixture
  passed desktop/mobile, both themes, grid, contrast, origin-only resources and EOF/disconnect/reconnect/hide/destroy
  lifecycle. Complete Marshall and Lilly gates passed on clean589ff7fe5; later source changes retain their
  own checks. The diagnostic correction grants no guest terminal or native-image admission.
