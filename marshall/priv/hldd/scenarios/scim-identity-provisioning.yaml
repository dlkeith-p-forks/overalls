boundary: Only the current SCIM bearer token (digest-compared) reaches /scim/v2. Deactivation or DELETE
  revokes logins at once, pauses owned machines and schedules deletion after the shared seven-day grace;
  reactivation inside grace resumes only SCIM-paused machines; after the deadline machines are deleted
  and the identity is ghosted and cannot be resurrected. While SCIM is enabled magic-link sign-in is refused
  and OIDC sign-in requires a JWKS-verified ID token whose sub matches an active SCIM externalId.
denial: Wrong, empty or Basic credentials get 401; forged, unsigned, re-signed, wrong-audience, wrong-issuer,
  expired or nonce-less ID tokens and replayed or state-mismatched flows are refused; inactive identities
  are refused by logins, SSH key sessions, agents and admission; reactivation after the deadline and writes
  to finalized identities are refused.
