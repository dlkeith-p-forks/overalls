  scope: 'Packaged Marshall in a NixOS VM: authenticated SCIM user create, PATCH active=false, DELETE
    and GET 404 over TLS with a read-only probe of the retirement deadline; deadline expiry is not exercised.'
- assertion: SCIM event histories never delete early and never resurrect
  execution: recorded
  kind: property
  path: marshall/test/marshall/scim/lifecycle_property_test.exs
  record: docs/architecture/reviews/2026-10-20-scim-completion.md
  record_assertion: 'Result: 94 passed'
  scope: Generated deactivate/reactivate/delete/clock/worker histories against the real resources and
    Oban worker in the BEAM test VM.
- assertion: replacing any character of a signed ID token is always rejected
  execution: recorded
  kind: property
  path: marshall/test/marshall/scim/oidc_id_token_property_test.exs
  record: docs/architecture/reviews/2026-10-20-scim-completion.md
  record_assertion: 'Result: 94 passed'
  scope: Generated tampering, truncation and algorithm substitution of RS256/ES256 ID tokens against the
    production verifier.
- assertion: machines pause at deactivation and are deleted only after the deadline
  execution: recorded
  kind: unit
  path: marshall/test/marshall/scim/user_lifecycle_oban_test.exs
  record: docs/architecture/reviews/2026-10-20-scim-completion.md
  record_assertion: 'Result: 94 passed'
  scope: Oban worker with the deadline moved into the past, against PostgreSQL; no native machine reclamation.
- assertion: query-supplied identity claims without a code never sign in
  execution: recorded
  kind: unit
  path: marshall/test/marshall_web/scim_oidc_controller_test.exs
  record: docs/architecture/reviews/2026-10-20-scim-completion.md
  record_assertion: 'Result: 94 passed'
  scope: Controller flow against a fake identity provider; no real provider or browser.
gaps: The machine test does not advance past the seven-day deadline, so deadline deletion and finalization
  are BEAM-only; no browser OIDC journey runs natively; the OIDC client secret is stored in plaintext.
id: scim-identity-provisioning
journey: An identity provider provisions, deactivates, deletes and reactivates Marshall users over SCIM,
  and users sign in with single sign-on
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Add a machine test that shortens the configured grace period and observes native machine
  deletion and finalization, and a browser OIDC journey against a fake provider.
scope: BEAM endpoint, Oban and Hegel histories against PostgreSQL plus a NixOS machine test of the deployed
  TLS endpoint; see ADR-0229.
