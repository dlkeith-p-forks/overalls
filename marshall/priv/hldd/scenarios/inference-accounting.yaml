id: inference-accounting
journey: Use private inference and retain usage receipts through an outage
layers:
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Add an integrated faulted Marshall acknowledgement and reporter recovery property, then
  exercise native provider-independent spool restart and retained usage accounting.
scope: Generated Ziggy spool saturation, partial acknowledgement, restart, exact capacity reuse and local
  completion-reply classification; existing native fixture-provider agent journey remains separate. Generated
  Ziggy version-refusal histories preserve durable completions while stopping automatic reporter retries.
