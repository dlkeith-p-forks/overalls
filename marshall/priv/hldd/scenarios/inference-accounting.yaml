boundary: Marshall authorizes current guest inference; Ziggy durably reserves bounded usage metadata before
  provider effects and removes completed receipts only after acknowledgement.
denial: A full spool refuses new provider effects; an incomplete admission cannot be acknowledged as completed
  usage or replayed as inference after restart. A conflicting completion remains visible as its own class
  and keeps the disputed receipt.
