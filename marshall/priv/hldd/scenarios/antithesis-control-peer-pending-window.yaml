boundary: Authored workload commands use OverallsProtocol.Control.Client against a loopback WebSocket
  peer and inventory exact wire request IDs, caller receipts, busy-without-frame refusal and late retired
  replies. The peer is a transport fixture outside the Marshall and Lilly service graph.
denial: Missing peer output, malformed typed fields, process failure or an incomplete frame inventory
  remain unavailable; they cannot be counted as a busy refusal or a successful retired-response oracle.
evidence:
- assertion: control client pending requests fit negotiated window and busy calls send no frame
  execution: present
  kind: manual
  path: antithesis/workload/control/bounds.py
  scope: Authored workload callsite only; no hosted verdict.
- assertion: Control responses settle only their live pending request
  execution: present
  kind: manual
  path: antithesis/workload/control/pending.py
  scope: Authored late-response workload callsite only; no hosted verdict.
gaps: No recorded hosted peer execution, independent Marshall/Lilly integration, fault campaign or native
  guest proof. Preferred property and machine tests for the real service graph remain separate.
id: antithesis-control-peer-pending-window
journey: Exercise Control pending-window capacity and retired replies through a real client and loopback
  peer
layers:
- transport
- execution
- recovery
preferred_gap: Run the exact selected peer command in a hosted image and retain its assertion receipt;
  test live Control effect and recovery separately with NixOS machine and generated property evidence.
scope: Two authored control workload commands and a typed closed-result parser are present. No hosted
