boundary: A pool-locked native allocation audit independently binds durable claim/spec, host/pool/VM nonce,
  GUID, mounts, closed file set, drive UID/type/length and ready-disk metadata. A safely contained private
  single-link marker is bounded to 16 KiB; boot artifacts must be nonempty root-owned single-link regular
  files with mode 0444 and combined marker/artifact sizes within the protocol's 1 GiB reservation. Only
  then may invalid bundle contents leave that child recognized without allocation credit, without decoding
  those contents. Measured ZFS free space still includes its bytes and any outstanding startup hold remains
  unoffset. Current launch/readiness codecs, authenticated capacity reports, startup settlement, cleanup
  authority and ADR-0159's no-legacy policy remain unchanged.
denial: Unknown children, foreign or corrupt claims/owners/GUIDs, unsafe mounts/drives/boot-file custody,
  damaged disk metadata, exceeded artifact bounds and unexpected files continue to withhold the pool.
  An invalid launch bundle cannot grant allocation credit, readiness, execution, image admission, metadata
  conversion or deletion authority. Recognition of retained storage cannot authorize guest access or physical
  cleanup.
