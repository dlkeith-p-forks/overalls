scope: The focused NixOS machine fixture passed in 221.51 seconds, exit 0. It prepares two real owned
  disks on mirrored ZFS, substitutes unsupported boot-bundle version 999 on one, and requires repeated
  fresh-process no-credit and readiness refusals while its valid neighbor retains credit and marker SHA-256
