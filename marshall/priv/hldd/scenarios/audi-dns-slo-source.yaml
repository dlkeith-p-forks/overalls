boundary: Audi DNS counts ordinary in-zone questions after an authoritative UDP or TCP reply and socket
  send; a mode-0600 numeric snapshot feeds a Rust exporter through an Audi-DNS-only collector intake.
denial: Malformed packets, out-of-zone refusals, unsupported transfers and truncated UDP responses cannot
  add successes; ordinary Audi DNS UID cannot enter the collector socket; queried names cannot become
  labels.
