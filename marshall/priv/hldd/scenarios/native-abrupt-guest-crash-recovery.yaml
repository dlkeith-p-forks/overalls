boundary: The fixture flushes and reads back exact home bytes, requires actual Firecracker SIGKILL, then
  boots the same disk with fresh MMDS authority. Native filesystem verification and retained bytes are
  required after recovery; final shutdown must be observed cleanly.
denial: Refuse old flush, workspace and terminal authority after restart. Refuse incomplete filesystem
  checks, corrupt or missing retained bytes, an unobserved SIGKILL, reused boot identity or unclean final
  exit; incomplete histories cannot publish a receipt.
