boundary: Nix provisions stable dashboards and datasources; Grafana authenticates the operator while its
  server-side datasource holds only reader-scoped log-store authority.
denial: Anonymous Grafana queries, reader credentials on insert paths and unprivileged credential reads
  refuse. Marshall has no diagnostic reader credential or query path.
evidence:
- assertion: assert page.request.get(origin + removed).status == 404
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/otel-marshall/browser.py
  record: docs/architecture/reviews/2026-10-09-observability-decoupling.md
  record_assertion: The current native otel-marshall gate passed in 113.32 seconds
  scope: Current source-built Marshall verified-TLS browser receives HTTP404 for retired SLO/log routes
    before and after ordinary-reader login, sees no overview links and refuses current/copied remembered
    sessions after exact stored revocation. This verifies Marshall's retired diagnostic presentation and
    retained login boundary; Grafana's independent operator login, production activation and seven-day
    compliance remain separate.
- assertion: check_operations_dashboard(grafana)
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/log-store/driver.py
  record: docs/architecture/reviews/2026-10-09-observability-decoupling.md
  record_assertion: The current native log-store/Grafana gate passed in 50.56 seconds
  scope: Current native Grafana HTTP API verifies all fifteen stable operations-panel IDs, titles, visualization
    types, Prometheus bindings and nonempty queries. Pinned VictoriaLogs plugin, verified TLS, hidden
    reader credentials, exact trace/log correlation, path/credential refusals and queued backfill also
    pass. This establishes current automatic provisioning and log-reader transport, not physical-host
    availability, production activation or numeric values for every operations query.
- assertion: /api/datasources/uid/overalls-victorialogs
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/log-store/driver.py
  record: docs/architecture/reviews/2026-10-09-observability-decoupling.md
  record_assertion: Native log-store/Grafana passed in 58.45 seconds
  scope: Native provisioned datasource/plugin, hidden reader credentials, exact trace correlation and
    wrong-scope insert refusals over the real log-store entry and Grafana proxy.
- assertion: before-reboot
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/logging/driver.py
  record: docs/architecture/reviews/2026-10-09-observability-decoupling.md
  record_assertion: Native logging passed in 129.29 seconds
  scope: Native source routing and durable unread journal backfill after reboot, destination outage and
    collector loss; isolated fixture disk budgets explicitly fit its disk.
gaps: Real external operator login, certificate rotation, production activation and effective retention
  require deployment acceptance. No notification delivery is implied.
id: grafana-provisioned-diagnostics
journey: Recreate operator dashboards and query traces and diagnostic logs from NixOS configuration
layers:
- identity
- authorization
- transport
- storage
- recovery
preferred_gap: Activate the coordinated fleet packages and verify an external authenticated operator's
  dashboards, freshness and source-to-trace/log correlation.
scope: Actual provisioned Grafana plugin/datasource/dashboard APIs, trace correlation, verified-TLS log
  ingestion and read-only query/refusal/backfill in disposable NixOS machines.
status: partial
