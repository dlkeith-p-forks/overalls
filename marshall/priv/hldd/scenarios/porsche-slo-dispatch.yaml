boundary: Porsche counts terminal SSH command dispatch results in fixed cumulative outcomes and duration;
  a private numeric file feeds a Rust exporter through a Porsche-only collector intake with Nix-owned
  service identity.
denial: Invalid and forbidden command outcomes stay outside the denominator; ordinary Porsche UID cannot
  connect to the collector socket; command text, sessions and receipts never become labels.
