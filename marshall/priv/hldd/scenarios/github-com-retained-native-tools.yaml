boundary: Current placement and executor fences select immutable tool artifacts. Native setup validates
  completed immutable source and owned checkout before replacing legacy wildcard Git trust with a durable
  exact include; its journal restores original configuration on failure.
denial: Pending or corrupt source refuses trust migration. Unrelated root-owned repositories must remain
  refused after upgrade. An absent source preserves historical policy and grants no claim that tightening
  happened.
evidence:
- assertion: retained_native_policy_is_exact_durable_and_preserves_unrelated_settings
  execution: present
  kind: unit
  path: lyra/src/agent/maintenance.rs
  scope: Linux-host setup journal, exact Git include, settings preservation and rollback; no native platform
    or isolation guarantee.
- assertion: /work/native-services/github-tools-receipt.json
  execution: present
  kind: machine
  path: nix/verification/tests/machines/native-services/driver.py
  scope: Published retained native images with synthetic tool and executor authority; current passing
    execution not yet recorded.
- assertion: retained executor bootstrap survives replacement and refuses stale receipts without turns
  execution: recorded
  kind: property
  path: marshall/test/marshall/agents/bootstrap_test.exs
  record: docs/architecture/reviews/2026-10-18-github-com-integration.md
  record_assertion: Current Marshall focused verification passed **53 tests**
  scope: Current-executor bootstrap idempotency and stale-receipt refusal in generated BEAM/database histories;
    no native runtime qualification.
gaps: FreeBSD boot 0 and boot 1 managed API, push, LFS and exact ownership checks passed under synthetic
  authority with independently certified clean shutdown between boots; the enclosing 270s check still
  failed historical executor withdrawn-group observation. OmniOS has not published a tool generation.
  Neither full retained native check passes. Newly selected FreeBSD 0150b6d1 separately has current-VMM
  qualification and allocation Git identity capability; selected OmniOS still lacks that capability. Those
  new-candidate results do not establish retained-tool upgrade, live fleet admission or absent-source
  later migration.
