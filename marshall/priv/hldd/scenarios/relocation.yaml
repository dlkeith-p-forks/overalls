gaps: Historical native results before ADR-0155 exercised retired pre-copy and retain their scope; the
  incoming stopped-only cut has separate 20-subtest evidence; its synthesized legacy-journal subtest was
  removed with the migration (ADR-0159), and the reduced scenario has not been rerun natively. No complete
  retained-state upgrade, independent physical-host failure, merged-editor relocation rerun or production
  acceptance is established. Production acceptance on 2026-09-25 refused transfer_busy due to an older
  clone retaining Overalls' slot. The newer NixOS Porsche fleet failed clone relocation on temporarily_unavailable
