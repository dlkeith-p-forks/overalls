boundary: Every Marshall LiveView mount, handle_params, handle_event and handle_info is admitted to the
  independent marshall_live Rust request recorder before it runs and settled once by outcome; a suffixed
  socket separates it from marshall_web, and its exporter reaches only the overalls-otel-marshall-live
  collector socket.
denial: Gauges, traces and self-reported callback metrics cannot become objectives; a missing recorder,
  duration series, coverage or warmup yields no objective value instead of success; an unavailable
  recorder never changes a callback's result; no view, event, param or user label is exported.
evidence:
- assertion: every callback is admitted before it runs and settled once by outcome
  execution: present
  kind: unit
  path: marshall/test/marshall_web/live_observability_test.exs
  scope: Fake registered recorder observes admission inside the callback and one success or failure
    completion; no real recorder or collector.
- assertion: suffixed sources read only their own variables
  execution: present
  kind: unit
  path: elixir/request_accounting/test/config_test.exs
  scope: Environment parsing for the unsuffixed and _MARSHALL_LIVE recorders.
- assertion: overalls:marshall_live_latency:ratio5m
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/otel-slo-rules.nix
  scope: promtool fixtures for five-minute completion and within-1 s ratios, empty seven-day windows
    without eligible history and empty negatives.
- assertion: real LiveView callbacks reach the independent marshall_live recorder
  execution: present
  kind: machine
  path: nix/verification/tests/machines/otel-marshall/default.nix
  scope: Packaged Marshall LiveView callbacks increment the marshall_live recorder and reach the central
    collector with service_name marshall_live.
- assertion: overalls:slo_marshall_live_latency:ratio7d
  execution: present
  kind: machine
  path: nix/verification/tests/machines/otel-fleet/default.nix
  scope: Provisioned dashboard JSON; no browser rendering.
gaps: Targets are provisional without a production baseline or seven-day eligibility. No browser renders
  the Grafana dashboard. Periodic handle_info ticks share the denominator with interactive callbacks.
id: marshall-page-service-levels
journey: Observe Marshall page interactions as recorder-backed completion and latency objectives in Grafana
layers:
- isolation
- transport
- recovery
preferred_gap: Measure a production baseline before fixing targets, and add a browser probe that renders
  the Marshall pages dashboard.
scope: Admission and settlement through the real LiveView telemetry handler, suffixed configuration, Rust
  recorder source allowlist, promtool rule arithmetic, the native otel-marshall path and dashboard
  provisioning.
status: partial
