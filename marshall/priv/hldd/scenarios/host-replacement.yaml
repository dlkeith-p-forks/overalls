boundary: Deployment enrollment binds each host to its real machine identity, name and ZFS GUIDs. Retirement
  is the only way to release host authority permanently; the retired row is never recycled or renamed.
denial: Refuse enrollment for recycled retired names, conflicting registrations and unready or unfresh
  hosts; refuse stale compute and inference credentials over every authenticated transport after retirement;
  refuse all issuance, sessions, exchanges, enablement and admission on a retired host forever.
evidence:
- assertion: generated histories converge with the oracle and end retired
  execution: recorded
  kind: property
  path: marshall/test/marshall/compute/enrollment_history_test.exs
  record: docs/architecture/reviews/2026-09-27-host-replacement.md
  record_assertion: property histories and rotation-reservation suites pass with recorded seeds
  scope: Real operator file boundary, control session and report ingests, both admission entry points,
    and drain/resume/retire against a pure model with complete-table refusal audits; no native claim.
- assertion: a resumed drain remains in history after a new drain request
  execution: recorded
  kind: unit
  path: marshall/test/marshall/compute/enrollment_history_test.exs
  record: docs/architecture/reviews/2026-09-27-host-replacement.md
  record_assertion: focused enrollment file passed **3 checks**
  scope: Real SQL-backed host history retains the closed drain alongside the current open request; focused
    file also reruns the two generated properties at the previously failing seed. No physical host replacement
    is exercised.
- assertion: credential histories preserve live guest reservations byte for byte
  execution: recorded
  kind: property
  path: marshall/test/marshall/compute/enrollment_history_test.exs
  record: docs/architecture/reviews/2026-09-27-host-replacement.md
  record_assertion: reservation digests stable across every generated history
  scope: Rotation, revocation, admission toggles and maintenance on a host holding a real reservation;
    retirement refused while resources are held.
- assertion: retirement fences concurrent rotations into one terminal retired state
  execution: recorded
  kind: unit
  path: marshall/test/marshall/compute/distributed_enrollment_test.exs
  record: docs/architecture/reviews/2026-09-27-host-replacement.md
  record_assertion: four distributed schedules pass with complete-table restoration
  scope: 'Three independent BEAMs over one committed database: same-name convergence/conflict, host-lock
    rotation serialization with idempotent prepared retries, and retirement fencing rotations in either
    lock order; seeded lock/fence mutants fire elsewhere in the suite inventory.'
- assertion: the replacement prepares over the protected SSH bridge with fresh identity
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/fleet/scenarios/host-replacement.py
  record: docs/architecture/reviews/2026-09-27-host-replacement.md
  record_assertion: native host-replacement journey passes
  scope: 'Real two-Lilly fleet: SOPS delivery, orthogonal storage GUIDs, v3 TLS session, readiness-gated
    enable and nested guest private-service reachability before and after replacement; stale compute/Ziggy
    refusal over the real TLS listener.'
gaps: Physical bare-metal providers, production DNS/CA and load, multi-region and database-loss rebind
  remain unverified; the replacement journey reuses the deployed fleet's shared fixture PKI and QEMU identity
  model, and lost-response retries are covered by the generated/local evidence rather than injected network
  partitions.
id: host-replacement
journey: Enroll a replacement host with fresh physical identity after retiring the old one
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Retain the native two-Lilly replacement journey with fresh physical GUIDs and stale-credential
  refusal. Rebinding a surviving fleet onto a replaced control-plane database belongs to the historical-authority
  improvement.
scope: Generated histories over the real Ash actions and authenticated control exchange against a pure
  model oracle, three-BEAM races for name and rotation serialization, and a native two-Lilly fleet journey
  with SOPS delivery, real v3 TLS sessions, real ZFS GUID binding and a nested guest reaching private
  services. Physical providers, production DNS/CA/load and multi-region are excluded.
status: partial
