boundary: A signed short-lived ticket binds the current actor, Android capability, machine and execution
  generation. One shared relay fans out RFB bytes to viewers and forwards input only from its controller.
denial: Foreign, stale, expired, non-Android and second-controller requests are refused; host-stream or
  emulator loss closes the display channel. A future host output sequence closes its Android channel and
  notifies its generation-bound owner rather than silently dropping bytes.
