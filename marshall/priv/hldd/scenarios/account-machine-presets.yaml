boundary: Accounts stores only the authenticated actor’s three independent groups. Browser forms seed
  matching initial values; Compute remains admission authority. An admitted launch reuses its original
  owner/key request before source-checked admission.
denial: Malformed sizes, forbidden profiles, disabled or source-incapable launch images, foreign target
  identifiers and revoked logins cannot persist defaults. Explicit machine drafts remain subject to ordinary
  admission.
