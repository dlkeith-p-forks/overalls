  The local actor-roster property does not establish native VMM survival or Marshall hold retention during
  a fenced Lilly. Runtime initialization composition of native inventory refusal into the host-wide vm_reconciliation_required
  fence remains source-inspection evidence. Real unit/cgroup inventory helper passed8.22seconds in the
  incoming d4499c4c merged native-zfs run, whose complete execution failed unrelated auto-update enrollment-receipt
  validation; no complete startup-fence or suite acceptance. The removed ambient-host assertion created
  no controlled unknown unit or failed scan and supplies no physical refusal evidence. Blocked pending
  a user-delegated architectural decision (new ADR) for quarantine, fencing and reconciliation of post-backup
  revocations, epochs, generations, reservations, terminal/login grants and pending commands against surviving
  physical state, with unknown allocations held unavailable.
id: historical-authority
journey: Reactivate a historical fleet snapshot safely
layers:
- identity
- authorization
- execution
- storage
- recovery
preferred_gap: Build a NixOS multi-host restore scenario and a property model of post-backup revocations
  before enabling automated reactivation.
scope: 'Current-protection pins only: the isolated restore drill boots the release in operator mode against
  the restored database with no listener sockets and no background consumers; fixed Lilly tests pin monotonic
  command receipts under regressed replay, while generated terminal-error histories stop one to four actor
  processes and preserve durable placements without proving native guest survival; guest-facing identity
  checks reject journal-only authority after restore. No complete automated historical-fleet reactivation
  acceptance is identified; the quarantine-gate and default-deny design sketch (restore sentinel, fail-closed
  quarantine boot, reconcile report, gated finalization) remains proposal-only pending user delegation
  (candidate ADR-A quarantine gate, ADR-B default-deny re-enablement).'
