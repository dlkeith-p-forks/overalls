boundary: A selected QEMU TCG NixOS Lilly host prepares a fixed ZFS member and samples pool/dataset GUIDs,
  capacity, and kernel cgroup CPU/memory. The private 9p witness identifies an image but does not grant
  Control authority. Enrollment and current authenticated reports must precede admission.
denial: Unavailable physical health, absent private credential, mismatched host/pool identity, disconnected
  Control or false execution readiness cannot be treated as schedulable capacity. A positive ZFS sample
  alone cannot prove guest readiness, native KVM isolation or crash recovery.
