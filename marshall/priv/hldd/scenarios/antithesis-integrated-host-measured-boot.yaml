preferred_gap: Run the selected private Docker topology at the built image identity, then record reviewed
  enrollment, current authenticated Control/report, a real nested guest and crash recovery; retain separate
  native NixOS machine and generated property evidence.
scope: The captured record preserves two stopped boots with unavailable health and exact third and fourth
  images that booted and emitted real ZFS/cgroup values. The fourth private-service host completed runtime
  PKI preparation and returned a workspace-source-v2 guest image witness. Its host credential, pool ID
  and CA were issued, but its application rejected runtime configuration before authenticated Control;
  the stopped-root journal recorded two invalid-configuration errors. Both measured samples remained disconnected
  and execution-unready; the first three image identities had private 9p witnesses. No authenticated Control,
  admitted nested guest or actual QEMU crash was recorded.
