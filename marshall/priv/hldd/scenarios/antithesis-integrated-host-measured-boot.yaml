  refused on the disabled host; no private role credential was issued. GuestTrust receipt and crash-actuator
  focused tests do not establish private service, terminal, adversarial network isolation or recovery
  execution. The full integrated-mode suite failed at 7/559. Native NixOS machine/property evidence and
  a hosted baseline remain absent.
