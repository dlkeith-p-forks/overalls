gaps: DNS TTL alone is not authority; cross-host refresh and production DNS delegation, CA behavior and
  sustained load require separate acceptance. Gateway credential rotation and live route restoration have
  local database evidence but no native journey.
id: ingress
journey: Publish a guest web service and withdraw access
layers:
- authorization
- transport
- execution
preferred_gap: Keep the native outage/refusal cases; add native gateway credential rotation with route
  restoration, then expand generated publication/lease event ordering.
scope: Native HTTP/WebSocket access and outage expiration scenarios, generated public/fleet listener route
  refusals, gateway credential-rotation certificate acknowledgement, Audi DNS publication/refusal histories,
  and Marshall's classified local ACME proof checks over TCP.
status: partial
