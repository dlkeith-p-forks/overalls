boundary: Current publication, TLS identity, renewable request lease and current execution. Gateway catalog
  decoder refuses TTL above five seconds; ordinary web/SSH grants have their separate thirty-second limit.
denial: Close a live response after access becomes private; expire authority during a control outage.
  After gateway credential rotation, refuse the old credential and any conflicting certificate installation
  while accepting the newer current generation of the same service.
