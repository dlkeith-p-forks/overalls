  source-handoff repair, and the corrected 1703s Ubuntu run stalled at Codeberg change after four initial
  and ten additional cases. Focused exact dnsmasq 2.93/musl evidence isolated fixture AAAA REFUSED; authoritative
  local-domain NODATA repaired the namespace probe and complete NixOS run. Latest frozen Ubuntu exited
  1 after 266.734s at initial guest startup with Lilly execution_failed, after browser sign-in/MFA/dedupe
  passed; no checkout/restart/matrix/download/CLI was reached and startup cause remains under diagnosis.
  Complete current Ubuntu acceptance is unresolved. Live provider API/smart-HTTP, Firefox public-provider
  network, production cutover/download/checkout and Brady interception remain unverified. Private repositories/self-hosted
  origins are out of scope. Guest writers share the checkout by design. The signed pending cookie holds
  one intent; concurrent response ordering is not a multi-tab queue. Obsolete sourced machines require
  recreation; retained bundle custody has no source-v1 adapter. Final extension sentinel removal passed
  actual Chromium/Firefox actions; four pure capture minimizer tests/types are enforced by workspace.check.
  Normal fragment/cookie/form resume composes in current native browsers, but focused browser assertions
  of query/hash sentinel removal, capture storage contents and sanitized POST contents remain unrecorded.
