boundary: Public CSRF capture grants no authority and stores only canonical source2, visit and expiry
  in the signed cookie. A current ordinary stored login or registered-key Porsche identity admits through
  Compute and a matching manifest4 source capability; ordinary browser provisioning requires no passkey.
  The postcommit receipt rechecks login and VM ownership before matched clear. Lilly carries inert source2
  bound to current placement, epoch and boot; only the guest contacts providers and runs git. Existing
  immutable snapshots/receiver records are never rewritten during cutover. Every validated new provision/start
  snapshot derives source from the durable VM, including supplied resize snapshots. Recovery preflights
  durable image eligibility without discarding valid crash/resize proof or fresh host reports.
denial: Source queries/fragments never enter capture storage/POST; URL user information refuses there,
  and raw authority/path stays strict backend input. Malformed or expired capture, missing CSRF, revoked
  or MFA-pending identity creates no machine. Unsupported origins/routes, option-shaped values, non-egress
  profiles, absent/obsolete/mismatched source capability and changed source under one idempotency key
  refuse before allocation. A stale completion cannot clear a newer observed capture. Stale boots, source
  conflicts, foreign API clone origins, redirects and obsolete stored sources refuse; a done marker cannot
  bypass stored-source validation. Supplied snapshots cannot replace the retained immutable image or recorded
  source. Unavailable restart capability releases only confirmed stopped compute and retains disk/address;
  confirmed resize completes a fixed source-unavailable failure, preserving target sizes and ordinary
  cleanup.
