boundary: The image is installed inside a KVM Nix sandbox from Microsoft's hash-pinned evaluation ISO
  with restricted user networking and pinned virtio-win drivers; Firecracker boots the edk2 CloudHv firmware
  as a PVH payload over the opt-in virtio-pci transport. The patched VMM keeps its 1.16.1 identity and
  static linking; its seccomp surface widens by exactly one vCPU-thread ioctl (KVM_IOEVENTFD) for BAR
  relocation. This scenario covers the operator launcher only (no jailer, no host network guard); the
  Lilly launch path is the separate windows-lilly-guest-launch scenario.
denial: The build fails without the OVERALLS-SETUP-COMPLETE serial marker and the firmware build fails
  without the PVH note or the patched aperture. The guest has a bootstrap Administrator credential and
  an interactive SAC login on serial, which must not be mistaken for the Linux console boundary. The manifest
  carries exactly the eight version-5 keys; a display name or any version-4 field is refused by the protocol.
evidence:
- assertion: Firecracker v1.16.1
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/firecracker-vmm.nix
  scope: The patched VMM reports the upstream version, lists --enable-pci and remains a static x86-64
    firecracker/jailer pair; it does not boot a guest.
- assertion: disable-legacy=on
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/windows-guest.nix
  scope: 'Builder rules: KVM sandbox, restricted networking, modern-only virtio-pci, pinned ISO and drivers,
    EMS enabled, no autologon, version-5 manifest shape, launcher flags. No installation or boot.'
- assertion: SAC>
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/windows-guest/driver.py
  record: docs/architecture/reviews/2026-10-14-windows-lilly-launch.md
  record_assertion: firmware banner after 252.9 s of guest time
  scope: Installs the evaluation image and boots it under the patched Firecracker on nested KVM until
    the Windows SAC prompt appears on the serial log. Firmware entry, ACPI, PM timer, virtio-blk-pci and
    EMS only; no networking or agents. Passed on 2026-10-14 (273.9 s script time).
gaps: No Marshall-driven Windows fleet matrix is recorded. The named image and nested KVM boot prove the
  operator and firmware paths only; WSL 2 and Podman nested virtualization, Hyper-V synthetic timers,
  SAC login and timekeeping under load remain unverified. Lilly launch, MMDS identity, agent trust/readiness,
  sparse template handling and Windows tools are covered by the linked scenarios.
id: windows-guest-firmware-boot-spike
journey: Build the Windows Server 2025 evaluation image offline and boot it under the patched Firecracker
  to the serial Special Administration Console
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Add the Marshall-driven multi-OS fleet journey and record WSL 2, timekeeping and SAC security
  evidence; retain the operator-only boundary for this scenario.
scope: 'Patched VMM identity, firmware provenance and offline assembly rules are checked without installing
  Windows; the nine VMM patches carry unit tests (PVH RSDP, PM timer, Hyper-V leaves, CMOS clock, BAR
  sizing and relocation with doorbell moves, virtio reset and re-activation, scatter-gather block requests
  on both I/O engines, vsock indirect descriptor tables). Recorded on 2026-10-13: the offline installation
  completed in about 255 seconds of guest time with all nine serial checkpoints, and the image booted
  under the patched Firecracker with both firmware variants to the Windows SAC prompt, answering `id`
  (OVERALLS, build 26100, Windows Server) and `i` (one virtio NIC). Recorded on 2026-10-14: the windows-guest
  machine test passed on nested KVM (firmware banner after 253 s of guest time, SAC> 6 s later, 274 s
  in total).'
status: partial
