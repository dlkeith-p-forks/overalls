boundary: 'One LiveView at /settings mounts through the AuthenticationPrivacy tag and LiveUserAuth''s
  :security mode, so the profile, passkey, SSH key, Git and machine-default sections all recheck the persisted
  login on mount, every event, every message and every parameter change; mutations use the socket actor
  through User.security, Marshall.SSH, User.set_time_zone, User.git_settings and User.save_machine_defaults;
  fragments (#profile, #security, #ssh-keys, #git-settings, #machine-defaults) carry no authority and
  return_to keeps its allowlist.'
denial: Refuse anonymous visitors with a sign-in redirect; answer 404 on /settings/profile, /settings/security
  and /settings/ssh-keys; refuse unknown events with a fixed flash and no change; a revoked login halts
  the next SSH key event or clock tick with a sign-in redirect; a weaker mount (optional, current_user
  or none) fails the pin test.
evidence:
- assertion: the merged page keeps the strict security mount of the former Security page
  execution: present
  kind: unit
  path: marshall/test/marshall_web/account_live_test.exs
  scope: Exact lifecycle mount ids [{AuthenticationPrivacy, :default}, {LiveUserAuth, :security}] and
    the /settings route to AccountLive
- assertion: the page renders every section behind one Account navigation entry
  execution: present
  kind: unit
  path: marshall/test/marshall_web/account_live_test.exs
  scope: 'All five section ids and index anchors, #nav-account current, #nav-usage, no /settings/* sidebar
    links, the account-menu clock link to /settings#profile'
- assertion: anonymous visitors must sign in and the old settings pages are gone
  execution: present
  kind: unit
  path: marshall/test/marshall_web/account_live_test.exs
  scope: Sign-in redirect on /settings and 404 on the three removed paths
- assertion: admin reads remain available but a mutation prompts step-up
  execution: present
  kind: unit
  path: marshall/test/marshall_web/account_live_test.exs
  scope: The no-key administrator redirect and the Users page link target /settings?return_to=%2Fadmin%2Fusers#security
- assertion: revoked browser login cannot change keys through an existing LiveView
  execution: present
  kind: unit
  path: marshall/test/marshall_web/account_live_test.exs
  scope: A revoked persisted token halts the SSH key event on the merged page with a sign-in redirect
    and no key is stored
- assertion: check_account
  execution: present
  kind: manual
  path: marshall/scripts/monospace_browser_probe.py
  scope: Current synthetic browser fixture targets the Account route and all five sections, retains Git
    preference and zone round trips, anchor positioning, grid alignment and light/dark/mobile screenshots.
    Source and static checks do not record browser execution of this repaired probe.
gaps: The NixOS browser tests, the passkey probe and the Antithesis access workload were rewritten to
  /settings by inspection and have not been executed against the merged page; no property test fits a
  page composition.
id: account-settings-page
journey: Open the single account page, move between its profile, sign-in, SSH key, Git and machine-default
  sections, and reach it from the sidebar, the step-up redirect, the SSH approval page and the CLI hint
layers:
- identity
- authorization
- transport
preferred_gap: Rerun the credential-self-service, mfa-login, admin-account, account-lifecycle, control-room
  and fleet Porsche browser machine tests on the merged page and record them; rerun the Antithesis access
  workload.
scope: LiveView tests of the merged page (sections, single navigation entry, the step-up redirect and
  Users link to /settings?return_to=%2Fadmin%2Fusers#security, the SSH approval confirmation, which stays
  on the approval page with the Open Mila link (ADR-0221) rather than navigating to /settings#ssh-keys,
  every former Security, SSH key and profile assertion) and a structural pin of the lifecycle ids and
  route; the synthetic browser probe checks the single sidebar entry, section order, anchors landing at
  the top, the zone round trip and grid alignment in both themes and at 390 px.
status: partial
