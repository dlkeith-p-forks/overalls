boundary: The pinned Underclass proxy holds a streamed 2xx response, for at most 60 seconds or 1 MiB,
  until its first output or terminal event. It retries on another pool account only when that terminal
  event is a capacity failure with no output before it, and it never sends a byte to the client from a
  discarded attempt. The overloaded account keeps its health and is skipped only for that request.
denial: Policy, quota and other failure codes are never retried on another account, and an error after
  any output passes through unchanged. When every account overloads, the client receives the original
  upstream bytes rather than a synthesized error, no banked reset is redeemed, and the SLO journal records
  one failure for the request.
evidence: []
gaps: No NixOS test drives an overloading upstream through the instrumented service, so SLO outcome counting
  across a failover is verified only by source review; live provider overload behavior on this revision
  is unobserved.
id: underclass-overload-failover
journey: Receive a served response instead of “Selected model is at capacity” when one pool account's
