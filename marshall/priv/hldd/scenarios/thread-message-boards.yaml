id: thread-message-boards
journey: Post to a private profile board, subscribe to a linked user thread, and replay a machine cleanup notification after stop or suspension.
boundary: PostgreSQL owns boards, posts, subscriptions and notifications. Posting checks current account, thread and machine authority. Machine-tagged post admission serializes with cleanup on the VM lock. Replay rechecks current thread permissions.
denial: Refuse foreign thread links, mismatched profiles or machine bindings, late posts to unavailable machines, inactive subscriptions and revoked readers.
status: partial
layers:
- identity
- authorization
- execution
- storage
- recovery
scope: Ash resource and coordinator tests in an isolated BEAM/PostgreSQL environment. No live guest notification delivery or multi-replica recovery claim.
evidence:
- assertion: machine transitions remove only their posts and retain one cleanup notification
  execution: recorded
  kind: property
  path: marshall/test/marshall/message_board_cleanup_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: ExUnit seed 78191
  scope: Generated lifecycle transitions and delivery retries produce one notification turn and audit receipt; paused destinations stay paused, revoked readers receive nothing, and audit failure rolls back turn, event and acknowledgement before successful retry.
- assertion: authorized readers can browse a previous machine generation
  execution: recorded
  kind: unit
  path: marshall/test/marshall/threads_transcript_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: ExUnit seed 67043
  scope: Subscription identity and cursor ordering survive replacement, replay and state changes work while pending, and old-writer inserts acquire durable attribution and the next cursor.
- assertion: board tools execute on the server with derived thread attribution and audit
  execution: recorded
  kind: unit
  path: marshall/test/marshall/agents/executor_session_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: ExUnit seed 505470
  scope: Server command execution excludes guest claims, derives machine and user-thread attribution, records completion audit, and returns linked posts only from the actor's profile board.
- assertion: a machine without a user thread still loses its board posts on stop
  execution: present
  kind: unit
  path: marshall/test/marshall/message_board_cleanup_test.exs
  scope: A Compute-created machine without a user-thread binding loses machine-tagged posts while retaining unbound account posts.
- assertion: subscription histories preserve identity and active replay authority
  execution: recorded
  kind: property
  path: marshall/test/marshall/threads_transcript_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: ExUnit seed 272987
  scope: Generated activation histories compare retained subscription identity and replay permission with an independent active/inactive model in fresh SQL sandboxes.
gaps: Native guest/provider delivery, cleanup-notification insertion failure injection and independent-connection races remain unverified or unfinished. Work profile naming is not resolved against the existing profile catalog. Automatic turn admission and cross-generation evidence are confined to one BEAM and isolated PostgreSQL.
preferred_gap: Add competing post/stop/replay histories and notification-store failure injection, then exercise guest subscriptions across physical suspension and machine replacement in a NixOS machine test.
