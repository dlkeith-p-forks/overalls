boundary: Ingress EditorAssetsReceipt binds each approved target's full release tuple independently to
  current host session/service generation. Every advertised editor/webview gateway must hold the complete
  configured set because neutral DNS cannot route by release; discovery remains separate from personal
  Editor admission.
denial: Withhold editor/webview records when any configured target lacks a live five-second matching receipt
  or the current route is unhealthy. A tuple approved only for the other image target grants no capability.
  Refuse malformed/foreign/duplicate registry entries, wrong release, service role, stale credentials,
  unknown paths, symlinks and unsafe asset methods.
evidence:
- assertion: distinct generated releases remain bound to finite configured targets
  execution: present
  kind: property
  path: marshall/test/marshall/editor/releases_test.exs
  scope: Generated Linux/Windows registry normalization and SQL rows, finite target names, distinct release
    admission and duplicate refusal. Pure configuration boundary; no native gateway runs.
- assertion: distinct release receipts coexist and publication requires their complete fresh set
  execution: present
  kind: unit
  path: marshall/test/marshall/editor_publication_test.exs
  scope: Actual PostgreSQL publication query requires both configured releases, preserves independent
    receipt expiry and removes editor/webview discovery after one expires. No DNS packet, TLS listener
    or multi-gateway fault history.
- assertion: v7 Windows editor publication matches only its target's exact approved release
  execution: present
  kind: unit
  path: marshall/test/marshall/editor_publication_test.exs
  scope: Actual SQL fixtures publish a v7 Windows owner only for its configured Windows tuple; swapping
    valid target descriptors removes that owner while complete neutral assets remain discoverable. No
    Windows guest or browser runs.
- assertion: Customer editor DNS and neutral webviews require live attested assets
  execution: recorded
  kind: unit
  path: marshall/test/marshall/editor_publication_test.exs
  record: docs/architecture/reviews/2026-10-10-browser-editor.md
  record_assertion: Publication tests withhold Customer editor and neutral webview DNS without live
  scope: Actual publication SQL with matching certificate/route/service fixtures, asset absence/readiness/expiry
    and foreign attestation refusal; not a DNS packet or native publisher.
- assertion: untrusted paths never select a file outside the three release assets
  execution: recorded
  kind: property
  path: audi/test/editor_assets_test.exs
  record: docs/architecture/reviews/2026-10-10-browser-editor.md
  record_assertion: passed 197 checks (54 properties, 143 tests), including those repairs
  scope: Generated path selection and fixed symlink/release/origin/method refusals inspect immutable local
    serving without guest connector authority.
- assertion: asset readiness follows the actual HTTPS service after nested suspension
  execution: recorded
  kind: unit
  path: audi/test/http_front_test.exs
  record: docs/architecture/reviews/2026-10-10-browser-editor.md
  record_assertion: passed in 8 Audi front checks
  scope: Actual local TLS listener and operator roots prove healthy current-release serving, refuse wrong
    release/SNI and refuse nested acceptor suspension while files and supervisor remain alive. No multi-gateway
    DNS or Firecracker claim.
gaps: Actual multi-gateway package mismatch/receipt expiry, native public DNS and TLS through Audi, publisher
  restart/version refusal and signing-key rollout have no recorded editor acceptance here.
