boundary: The reset route, page button and underclass reset command require the host's admin bearer token;
  a remote --url call must carry UNDERCLASS_UI_TOKEN and never sends a database token.
denial: Proxy-only, monitor-socket and unauthenticated callers cannot redeem credits; without force the
  proxy refuses an allowed or already-redeemed account with 409, and a missing credit or non-Codex account
  is never overridable.
