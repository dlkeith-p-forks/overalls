gaps: Native n99x4 passed both distributions with ADR-0124 certificate-gated readiness and the corrected
  physical refusal on 0cfa6302. Subsequent aaba77ee gateway startup-retry integration has separate upstream
  native evidence; this result remains attached to its captured base. Four rejected candidates and an
  orchestration-aborted attempt retain their exact scopes. Lifecycle/digest property executions and receiver-side
  failure-exhaustion are recorded on 40c1e73b in the 043 review (2 properties on seeds 0/43043; six probe
  executions, eight completed refusals each). ADR-0113's sender-side terminal trust-retry exhaustion (at
  most three attempts, then fencing; canonical 053), independent physical hosts and the seven legacy feature
  matrices remain separate. Historical native relocation evidence retains its captured revision.
id: guest-trust
journey: Boot and restart a guest with the current host trust roots
layers:
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Rerun the seven legacy feature matrices on current source, verify sender-side terminal
  trust-retry exhaustion (053) and extend to independent physical hosts.
scope: Strictly typed bounded NixOS/Ubuntu native fixture on two colocated Lilly nodes; exact host roots,
  actual guest services, local HTTP and retained data on restart. Wrong, forged and expired delivery mutations
  each terminate in completed peer-EOF refusals before unchanged receipt, installed bundle and service
  checks and a final accepted same-boot delivery. Sequential three-NixOS admission checks usable startup
  and durable ownership. A valid 17 GiB-root request exceeds the independently read actual 16 GiB quota;
  the fixture does not impose a settled virtual-promise cap or rerun the concurrent capacity race.
status: partial
