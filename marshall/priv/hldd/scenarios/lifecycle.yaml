id: lifecycle
journey: Create, stop, restart and delete a machine
layers:
- transport
- execution
- storage
preferred_gap: Extend property state models and native interruption cases together when lifecycle transitions
  change. Execute the replacement independent-observability native and property scenarios; historical
  test receipts cannot establish the cutover.
scope: Generated operation histories with an independent durable transition oracle, generated Lilly actor
  attempt-ordering, supersession and actual actor-kill histories with a durable fake executor, plus native
  lifecycle and storage cleanup. Direct generated lifecycle audit-retention sweeps check bounded batches
  and maintenance continuations. Generated Lilly transient exchange prefixes followed by version refusal
  retain durable intent and fence further ticks. Generated authenticated local HTTP host-session takeovers
  retain exact epoch growth and permanently refuse all consumed older nonces. A new local generated tail
  checks one to four late receipts after VM archival and changed replay. Current source2 crash and stale-to-fresh-report
  SQL regressions passed in the final focused 39-check source/snapshot/editor set; native scope remains
  separate.
status: partial
