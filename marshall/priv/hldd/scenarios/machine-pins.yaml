  pin/delete races are argued from the shared VM row lock, not observed; team-admin pinning is undecided.
id: machine-pins
journey: Pin a machine to the top of the lists and keep it from being deleted until the owner unpins it
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Add a native Porsche journey that pins, is refused rm, unpins and deletes, and a packaged-browser
  toggle check; keep the generated BEAM histories as the model oracle.
scope: Generated owner/member pin and delete histories through the real domain action and the real SSH
  rm path against local PostgreSQL, a per-user ordered-set model over three machines, pagination with
  random page sizes, LiveView toggles on the list, overview and header with the disabled Delete and refusal
  flash, SSH pin/unpin/rm command tests and the cross-application closed reason set. No native journey.
