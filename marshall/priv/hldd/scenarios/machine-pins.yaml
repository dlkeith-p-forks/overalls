boundary: A pin is a per-user Access row with a two-state machine (pinned, unpinned) and one live row
  per user/machine; it confers no authority. The lifecycle coordinator reads the owner's live pinned row
  under the VM lock and refuses every delete path with machine_pinned; the owner's account deletion archives
  the owner's pins first; both VM archive sites archive every remaining pin.
denial: Refuse pinning without current read access, on deleted intent (vm_deleted) and past twenty pins
  (pin_limit); refuse browser, Fleet workloads, SSH/Porsche rm and thread deletes while the owner holds
  a pin; never let a shared user's pin fence deletion or a pin extend revoked access.
