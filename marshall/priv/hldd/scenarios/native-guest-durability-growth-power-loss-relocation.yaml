boundary: Real FreeBSD and OmniOS images boot in nested KVM with Lilly's Writeback/Sync drive mode on
  a disk file inside a host ZFS dataset and fresh MMDS placement, epoch and boot challenge. Interrupted
  growth SIGKILLs the VMM at traced writes past the old disk end; power loss replays only the dm-log-writes
  journal prefix before the cut; relocation moves a stopped disk by ZFS send/receive to a second host
  and boots it under a new placement.
denial: Refuse a FreeBSD flush receipt unless a device cache flush succeeds. Fail on an inconsistent filesystem,
  a root size other than old or new, a surviving unflushed host canary, missing or altered acknowledged
  bytes, a mismatched snapshot GUID or workspace digest, reused boot identity, or acceptance of flush,
  workspace or terminal authority from the pre-cut boot or source placement.
