gaps: One kill point per growth stage; no physical disk or firmware cache; no Lilly transfer or Marshall
  relocation orchestration; no live-source split brain; the relocated workspace is a flushed file rather
  than a Git checkout. The promoted FreeBSD image predates the device flush fix. An intermittent OmniOS
  first-boot growth-service SMF maintenance failure on ZFS-hosted disks remains unexplained.
id: native-guest-durability-growth-power-loss-relocation
journey: Keep a native guest's acknowledged bytes and root consistent across interrupted growth, host
  power loss and relocation to another host
layers:
- identity
- authorization
- execution
- storage
- recovery
preferred_gap: Promote a FreeBSD image carrying the device flush, then drive interrupted growth, power
  loss and relocation through Lilly and Marshall on physical hosts with multiple kill points.
scope: All six ADR-0243 checks passed on final source. A pre-fix FreeBSD candidate lost its acknowledged
  marker after power-cut replay because UFS sends no BIO_FLUSH; the agent now issues DIOCGFLUSH and the
  rebuilt candidate passed with 36 device flushes inside the guest-flush segment. Promoted OmniOS omniosGuest
  passed growth (430.14 s), power loss (267.22 s) and relocation (300.46 s); the FreeBSD candidate passed
  growth (307.38 s), power loss (192.05 s) and relocation (206.07 s). Receipts retain native_admission=false.
status: partial
