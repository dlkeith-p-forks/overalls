boundary: 'MarshallWeb.SecurityHeaders sets one Content-Security-Policy (script-src ''self'' plus ''wasm-unsafe-eval''
  for the terminal sixel decoder, ADR-0230; style-src keeps ''unsafe-inline'' for the vendored xterm.js
  and Mermaid renderers), Permissions-Policy, same-origin opener and resource policies, nosniff, SAMEORIGIN
  framing and no cross-domain policies before health, static files, the early /api refusals and the router.
  MarshallWeb.NoIndex adds X-Robots-Tag on the same surfaces and the root layout repeats it as a robots
  meta tag beside the disallow-all robots.txt. Production sends HSTS max-age=63072000 with includeSubDomains
  and no preload. The production session cookie is __Host-marshall (Secure, HttpOnly, Path=/, no Domain,
  SameSite=Lax, signed and encrypted) and the remembered credential is __Host-remember_me; MarshallWeb.BrowserSession
  owns the options for Plug.Session, the LiveView socket and every forged-session test or release probe,
  and expires legacy cookie names carried by a request. Headers and cookies grant nothing: stored-login
  checks, Cedar and CSRF tokens decide access, and user applications on *.apps.ghuntley.dev remain same-site
  with Marshall.'
denial: 'Inline, foreign or evaluated script, plugins, foreign frames, form targets outside self and the
  fixed https://ghuntley.com newsletter fallback origin, and cross-site framing of Marshall are refused
  by the browser; unrestricted https: is not a form source. A __Host- cookie set by a sibling origin or
  without Secure/Path=/ is dropped; the test build refuses development-tooling policy sources; a route
  may tighten but never duplicate a header.'
