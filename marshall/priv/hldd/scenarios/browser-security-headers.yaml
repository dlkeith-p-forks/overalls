- assertion: presentation-no-csp-violations
  execution: present
  kind: manual
  path: marshall/scripts/monospace_browser_probe.py
  scope: 'Chromium 151 with Playwright 1.59 against the disposable fixture: strict policy header on every
    navigation, zero CSP violations through the owner routes in both themes and the thread views; the
    run stopped on pre-existing thread layout findings, so the final evidence line was not printed.'
gaps: No NixOS machine test asserts the headers, HSTS or cookie attributes over the packaged release and
  TLS proxy, and the production deployment has not been observed sending them. The credential-rotation
  and mfa-login machine tests were not re-run after the cookie rename. The browser probe did not reach
  its final evidence line because of a two-pixel thread-workspace grid offset and a thread-activity overflow
  that reproduce with CSP bypassed. User applications stay same-site with the control plane, so SameSite
  gives no CSRF protection against them.
id: browser-security-headers
journey: Open Marshall in a browser and receive the same strict security headers, no-index directives
  and host-prefixed cookies on every response
