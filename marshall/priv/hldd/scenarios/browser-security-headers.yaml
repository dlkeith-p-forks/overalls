preferred_gap: Add a NixOS browser machine assertion for the header set, HSTS and the __Host- cookies
  over the packaged release, re-run the credential-rotation and mfa-login machine tests, and fix the thread
  layout findings so the probe completes. A generated-policy property adds nothing over the fixed header
  strings.
scope: Unit tests assert the exact header set on a rendered page, the signed-out redirect, a static file,
  the health probe, a refused /api path and a JSON API reply, the production versus development policy
  strings, the :secure and :plain session options through Plug.Session including encryption and legacy-name
  expiry, and the __Host-remember_me Set-Cookie attributes issued by a real magic-link sign-in. Covenant
  obligations I7 and I8 repeat the header and cookie invariants. The Playwright probe asserts the strict
  policy header on every navigation and fails on any securitypolicyviolation or Chromium CSP console report;
  it recorded zero violations through the owner routes in both themes and the thread views before stopping
  on pre-existing thread layout findings unrelated to the headers.
