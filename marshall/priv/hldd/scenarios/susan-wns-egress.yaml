boundary: Susan admits a WNS channel URI only in the susan-wns-channel-shape form, seals it in the push
  key and re-checks it before each send; Entra ID tokens come from the compiled login.microsoftonline.com
  origin.
denial: A channel URI with another scheme, host, port, userinfo, fragment or length, or a sandbox environment,
  is refused with the fixed 400; WNS 404/410 marks the token unregistered and 401 refreshes the Entra
  token once.
evidence:
- assertion: an accepted channel always posts to a notify.windows.com host on 443
  execution: present
  kind: property
  path: susan/test/susan/wns_channel_property_test.exs
  scope: Hegel over schemes, host suffixes, ports, userinfo and paths.
- assertion: a WNS key sends a raw notification to its channel after one Entra exchange
  execution: present
  kind: unit
  path: susan/test/susan/poke_test.exs
  scope: Poke pipeline over Susan.FakeProvider.
gaps: WNS is not enabled in the deployed Susan, no Entra credentials exist, and Susan's config-loading
  tests run only on Linux.
id: susan-wns-egress
journey: A Windows Mila exchanges its WNS channel URI for a push key and later receives a raw poke
layers:
- transport
- authorization
preferred_gap: Extend the susan-service machine test with WNS credentials and a fake *.notify.windows.com
  origin behind its private CA once the service module gains wnsAppIds.
scope: BEAM unit and Hegel property tests over the fake provider transport. The Nix service module does
  not enable WNS and no machine test fakes a WNS origin.
status: partial
