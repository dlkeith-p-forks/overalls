gaps: Both original feature witnesses and incoming d4499c4c merged witnesses passed after correcting setup
  co-location/transfer enrollment and the shared-delete oracle for legitimate relocation source cleanup.
  The final oracle preserves unchanged whole-VM count plus zero retained-placement deletes. Retained disks,
  restore reconciliation and rollout remain separate; mixed old/new serving releases are unsupported.
  Arbitrary interruption points, independent physical-host failures, hardware authenticators, live SMTP
  and later incoming integration remain separate.
id: account-lifecycle
journey: Invite, retire and register a fresh identity with the same email
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Retain both serial generated-identity lifecycle results and historical email-derived evidence
  at their actual scopes. Extend native arbitrary-interruption and independent physical-host schedules;
  preserve real admission/reservations and live shared-stream/home witnesses. Real SMTP and hardware authenticator
  acceptance remain distinct.
scope: Historical 009 retirement/cleanup and the complete fourth extended NixOS journey on f4de549a retain
  their email-derived identity scope. Current database tests establish canonical reservations, migration
  and rollback. Original feature NixOS (484.07 seconds) and Ubuntu (541.14 seconds) generated-identity
  lifecycles passed retirement closure, fresh same-email/no inheritance, physical cleanup, retained shared
  GUID/PID, old-home reservation, explicit fresh sharing and packaged Lyra SSH. Those records apply to
  base 63a1443c plus feature f1bd0e05. Separate incoming d4499c4c merged eight-subtest lifecycle captures
  passed on NixOS438.33seconds and Ubuntu574.18seconds; they do not establish later browser-launcher/shared-observability
  integration.
