boundary: Version-6 manifests and version-3 bundles explicitly bind FreeBSD or illumos (the OmniOS wire
  family) to its matching agent set, firmware boot kind, raw-GPT root and bounded artifacts. Unqualified
  native capability rows remain all-false. Complete exact identity qualification enables readiness, trust,
  terminal, workspace, flush, SSH and agents only for the sealed reviewed FreeBSD image. OmniOS and changed
  candidates remain refused; editor and Inception remain disabled. Lilly keeps the Windows Hyper-V CPU
  template off native guests.
denial: Unknown OS values, cross-OS agent sets, extra keys, malformed boot arguments and out-of-bound
  artifacts are refused. A metadata or focused jail test must not be treated as a native guest boot or
  fleet result.
