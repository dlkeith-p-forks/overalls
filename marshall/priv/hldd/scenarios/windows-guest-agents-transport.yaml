boundary: OverallsProtocol.GuestAgents names the closed agent set (linux, none, windows-v1) and a pure
  capability table; Lilly's jail, driver and executor and Marshall's per-capability image facts branch
  on the table, never on the set's name, so the agentless none row reproduces ADR-0170 exactly. The firmware
  jail gets the jail-local vsock endpoint only for an agent set that speaks the Lilly protocols. The readiness
  budget is the agent set's (600 s for windows-v1) and is recorded once per boot. The image ships the
  virtio-win viosock driver and, until the real agents exist, a SYSTEM probe that discovers the provider's
  address family at runtime, listens on vsock port 1099 and answers the host's CONNECT with one JSON line,
  publishing only its own log on the EFI system partition. Windows binaries are cross-built from the shared
  Lyra crate with the pinned zig toolchain; the Lyra gate type-checks the library and the Windows bins
  for x86_64-pc-windows-gnu. Images are configured as { path } objects; a size check decides template
  cacheability and every root disk is copied on demand (ADR-0177); both hosts' template budget is 96 GiB.
denial: An unknown agent set string, a workspace source version 2 on an agentless manifest or a ninth
  manifest key is refused by the protocol; an older Lilly refuses a windows-v1 bundle, so the converged
  push precedes any placement. A missing, corrupt or mismatched manifest yields every capability false
  in Marshall. A bare image path or any image key beyond path, including the retired standby key, refuses
  Lilly's configuration. The probe carries no identity or credential material. The editor and the Inception
  profile stay refused for windows-v1.
evidence:
- assertion: windows_v1
  execution: present
  kind: unit
  path: protocol/test/guest_agents_test.exs
  scope: The agent set wire values, the capability table and the readiness budgets are closed and pinned;
    no manifest or guest is involved.
- assertion: windows_v1
  execution: present
  kind: unit
  path: lilly/test/vm/jail_test.exs
  scope: The agentless firmware jail configuration is unchanged and windows-v1 adds exactly the vsock
    key; no Firecracker process runs.
- assertion: cacheability is the artifact size against the pool budget, without hashing
  execution: present
  kind: unit
  path: lilly/test/host/image_template_cacheable_test.exs
  scope: Cacheability is a size check against the pool budget on staged images; no pool or dataset exists.
- assertion: windows-v1
  execution: present
  kind: property
  path: marshall/test/marshall/compute/image_guest_agents_capability_test.exs
  scope: Capabilities are bound to the validated manifest and its exact image ID for both firmware agent
    sets and fail closed otherwise; sandboxed Ash resources only.
- assertion: viosock
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/windows-guest.nix
  scope: 'Builder rules: viosock in the driver tree, the agents directory and probe task only when agents
    are supplied, manifest agent set and workspace source version from the builder arguments, the launcher''s
    vsock device. No installation or boot.'
- assertion: windows-v5-editor=false
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/editor-target-boundaries.nix
  scope: Static package metadata asserts the editor and broker target x86_64-linux and the Windows v5
    package has no editor field or capability. This preserves the windows-v1 editor refusal; no Windows
    broker, browser origin or browser journey is exercised.
- assertion: editor_capability == false
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/windows-editor-runtime.nix
  scope: Pinned Windows Node and ripgrep runtime metadata evaluates with editor_capability=false and no
    references; this stages executables only and does not build or run a Code OSS bundle.
- assertion: proptest!
  execution: present
  kind: property
  path: nix/domains/artifacts/vscode-web-broker/src/windows_model.rs
  scope: Portable Rust properties and fixed tests bind names and peer custody to the boot/descriptor/account/SID
    identity, refuse foreign or incomplete recovery without cleanup, reject truncated SIDs and ambiguous
    local paths, and quote Windows command lines. No Win32 API, listener, VM or browser runs.
- assertion: ensure_account
  execution: present
  kind: unit
  path: lyra/src/bin/overalls-ssh-sync-windows.rs
  scope: The Windows authorizer serializes account ensure with the shared roster lock and requires the
    exact canonical username/UID roster pair before mutation; no Windows account or SSH daemon is exercised.
- assertion: overalls-winprobe
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/windows-guest/driver.py
  record: docs/architecture/reviews/2026-10-14-windows-guest-agents.md
  record_assertion: Gate 1 nested execution recorded
  scope: Installs the image with the viosock driver and the probe, boots it under the patched Firecracker
    on nested KVM to the SAC prompt, dials vsock port 1099 through the launcher's Unix socket, asserts
    the probe's JSON answer names host CID 2, and reads the probe's published log from the EFI system
    partition. Operator launcher only; no Lilly, no agents. Passed on 2026-10-14 (318.8 s script time;
    probe answered 23.7 s after the SAC prompt with address family 40 via the control device).
- assertion: validation_binds_boot_digest_and_certificate_shape
  execution: present
  kind: unit
  path: lyra/src/guest/trust.rs
  scope: 'Shared trust rules: frames are bounded and round-trip, a request is accepted only for the exact
    boot with a matching digest and well-formed unique certificates, and the bundle is assembled from
    the base roots; the MMDS client''s token-per-fetch exchange and document validation and the readiness
    line''s six keys are covered beside it. Rust unit tests in the Lyra check.'
- assertion: authorized keys are pulled per account and follow key removal
  execution: present
  kind: unit
  path: marshall/test/marshall/ssh/guest_access_test.exs
  scope: The pulled key list names the roster's writers with exactly their unarchived registered keys,
    drops a removed key on the next pull, refuses a foreign or bootstrap binding and a bad credential,
    and records no login. Sandboxed Ash resources; Ziggy's route tests refuse the bootstrap binding on
    the new path.
- assertion: reconcile_activates_deactivates_and_journals
  execution: present
  kind: unit
  path: lyra/src/guest/ssh_roster.rs
  scope: 'Shared roster rules with a fake account backend: names fit both platforms, stale and diverging
    rosters are refused without mutation, departed accounts are disabled before new ones are activated,
    and a failed activation leaves the staged union in the state.'
- assertion: ready_answered
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/windows-lilly-guest/driver.py
  record: docs/architecture/reviews/2026-10-14-windows-guest-agents.md
  record_assertion: passed end to end on the reference-guarded image
  scope: 'The windows-v1 image through the real Lilly driver on nested KVM: the jail carries the vsock
    device, the guest''s trust daemon installs the delivered roots and answers the installed receipt with
    a boot UUID, provisioning reaches ready with the same UUID within the 600 s budget, the unattested
    commit is refused, terminald authenticates the boot over vsock, lists root first, refuses an account
    the roster never created and runs a root PowerShell under ConPTY that prints a computed marker, a
    workspace delivery is recorded settled for the boot, port 22 stays closed without a roster, Inception
    stays refused, and a restart from the portable bundle yields a different boot UUID. Passed on 2026-10-15
    in 2863 s on the reference-guarded image. No roster SSH, roster-user terminal, clone or agent turn.'
- assertion: agentd start
  execution: present
  kind: machine
  path: nix/verification/tests/machines/windows-lilly-guest/driver.py
  scope: The agents composition reads the closed agentd startup line from the live Windows EFI partition
    after the real guest reaches ready. This proves native agent task startup only; the Lilly-only fixture
    has no Marshall context snapshot, provider exchange or Windows fleet turn. Execution remains present
    until the composed check is recorded.
gaps: 'Fleet proofs on 2026-10-15 cover creation to ready in seconds, trust, roster accounts and sshd,
  the host certificate, executor registration, a public workspace clone and a relocation between hosts
  (review). Still unproven: an SSH login through Audi, a roster-user ConPTY terminal under an S4U logon
  and an agent turn (they need a browser-approved key), crash restart of the scheduled-task agents, the
  pool-level refill with an uncacheable image configured, and no Marshall-driven Windows fleet test makes
  any of the fleet proofs repeatable; ConPTY re-renders terminal output. The staged editor runtime/source
  and broker custody model retain separate cross-link and bounded native library evidence; no native Windows
  listener/account/task VM journey, admitted image, browser origin or editor sign-in/edit/readback/recovery
  evidence is recorded.'
id: windows-guest-agents-transport
journey: Give Windows guests an agent set with a capability table, reach a guest-side listener over virtio-vsock
  through the viosock driver, and make the fleet ready to stage the image
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Record the browser-approved proofs (SSH through Audi, a roster-user terminal, an agent
  turn) and add a Marshall-driven Windows fleet test so the fleet proofs become machine tests.
scope: 'Protocol tests pin the capability table and the windows-v1 manifest and bundle vectors; Lilly
  tests pin the agentless jail configuration, the vsock addition for windows-v1, the recorded readiness
  budget, the image configuration shape and template cacheability; Marshall tests bind the capabilities
  to the exact image ID for every agent set and exercise the per-capability surfaces; the windows-guest-unit
  evaluation checks the viosock driver, the agents directory, the probe task, the manifest arguments and
  the launcher''s vsock device; the lyra check builds and type-checks the Windows target. Recorded on
  2026-10-14: lyraWindows built overalls-winprobe.exe (PE32+, 320 000 bytes) through zig. The windows-guest
  machine test dials the probe through the launcher''s vsock socket after the SAC prompt and reads its
  published log. The agents composition now also inspects the live Windows EFI log for the closed agentd
  startup line; this is present evidence only until the composed check runs. The staged Windows editor
  runtime and source recipes retain editor_capability=false; the editor-target-boundaries and windows-editor-runtime
  evaluations pass. The broker has 26 passing portable library and 7 Linux binary tests, Linux/Windows
  clippy and production Windows cross-link evidence. Thirty actual Windows library tests cover named-pipe
  timeout/cancellation and ACL descriptor/refusal checks; personal worker, task and browser lifecycle
  remain unrecorded. The separate editor candidate uses manifest v7/windows-editor-v1 and bundle v4 while
  this existing windows-v1 row remains editor false. The prior selected sealed e9ed22f1 image in live
  run 075200 reported ready while sshd was stopped and CLI SSH failed; that current failure is distinct
  from earlier dated fleet proofs.'
status: partial
