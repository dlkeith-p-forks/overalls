boundary: The pinned Rust proxy validates its bearer and parsed model request before durable admission;
  an independent exporter reads only a restricted numeric snapshot and a separate collector intake assigns
  fixed source provenance.
denial: Reject proxy use of admin or invalid credentials and malformed JSON outside the denominator; accounting
  saturation or uncertainty prevents provider effects. Missing, stale or incomplete source observations
  remain unknown rather than healthy.
