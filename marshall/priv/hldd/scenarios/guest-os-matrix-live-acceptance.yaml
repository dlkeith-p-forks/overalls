boundary: The opt-in private runner requires explicit distinct catalog IDs for all seven OS keys, with
  null marking unavailable images. Selected IDs must match exact catalog names and the intended account.
  New lifecycle mutations and guest probes bind durable create receipts to canonical UUID, current owner,
  name, image, profile and SSH endpoint. Personal-account probes use the installed Overalls CLI with strict
  guest trust; this client-side ledger does not replace Marshall authorization, current-boot attestation,
  Lilly fencing, guest/host isolation or native storage ownership.
denial: Missing or unadmitted selected images refuse preflight before creation; an explicit subset retains
  its scope. Changed fixture bindings refuse before new mutations or guest access. Transport failure,
  timeout, nonzero exit, a generic Linux response, a wrong distribution/native release or a catalog label
  alone cannot pass the OS oracle. Windows alone admits the exact stock three-line OpenSSH post-quantum
  warning with LF or CRLF endings; changed, extra or repeated stderr and the same warning from every other
  family fail, and no SSH trust or algorithm option changes. Unknown lifecycle outcomes retain the original
  request ID rather than creating fresh work; cleanup only uses the run's receipt-bound UUIDs.
