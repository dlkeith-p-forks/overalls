  lifecycles and deleted cleanup. The 075200 ledger independently passed complete NixOS/Ubuntu lifecycles.
  FreeBSD passed through repeated SSH; original cleanup first failed on retained namespace absence and
  a management transport error, then completed deleted after normal idle rootless context retirement with
  fresh zero-active-work proof. No force, migration, database repair or replacement intent was used. Original
  Arch/Alma creates failed before init on mode-stripped images. Corrected offline filesystem and cross-host
  checks passed, but the separate 085815 exact-image creates failed: Arch reached units/SSH listening
  before readiness_timeout; Alma encountered SELinux mount-context denials. Windows reported ready but
