boundary: Disposable PostgreSQL, migration, two Marshall HTTPS processes, reviewed Lilly enrollment and
  a fresh connected host report precede the sole workload setup signal. A SELECT-only TLS oracle checks
  committed migration, positive report sequence, a timestamp within 60 seconds and a durable session matching
  current session ID, host ID and epoch. Execution and real Control probes enforce wire v4 separately;
  SQL does not infer a protocol version. Hosted controlled pools report unavailable capacity and false
  execution readiness.
denial: Missing or inconsistent synthetic credentials, absent migration, failed TLS or HTTPS readiness,
  unavailable SQL, stale or disconnected host reports and timeout refuse setup. A controlled command marker
  cannot prove guest boot, native storage, stop, delete or cleanup; guest callbacks remain unavailable.
