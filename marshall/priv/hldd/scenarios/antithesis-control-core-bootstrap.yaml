gaps: The controlled container committed cgroup-derived effective fields, but raw cgroup files were not
  independently compared. Pool capacity remains nil and execution readiness false. The selected manifest
  is stale; retained-volume recovery and hosted ingestion are unverified. BEAM fallback has no branch
  coverage, Python catalog scanning is not source coverage, and native Rust instrumentation is pending.
  KVM and physical isolation need separate machine evidence.
id: antithesis-control-core-bootstrap
journey: Start an isolated control fixture and establish one truthful Antithesis setup signal
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Freeze the corrected selected manifest against actual image/source identity, independently
  compare measured cgroup files with committed fields, exercise retained-volume recovery and record hosted
  SDK ingestion. Add native NixOS and generated property evidence for guest effects.
scope: An earlier local Compose diagnostic started PostgreSQL/migration, Marshall A/B, enrollment and
  Lilly health and created three synthetic users/passkeys, but its connected v4 host had report_sequence
  0 and setup was withheld. A later fresh project emitted setup after a connected, fresh v4 report at
  sequence 44. Six serial Control commands exited zero and emitted 13 true SDK assertion records; later
  SQL found fresh sequence 392, a report counter rather than command or physical capacity count. Its selected
  manifest has four stale runtime-dependency hashes, so the local image execution is not a frozen hosted
  baseline. The 104-item catalog has no fully implemented hosted property. Separate TCG records are outside
  this control setup.
status: partial
