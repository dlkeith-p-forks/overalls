boundary: A disposable test-only guest retains one peerless identity socket and pending accept/read/write
  operations before a real pause/full-snapshot/resume sequence. Only the fixture owns the private Unix
  API socket and disposable snapshot/memory files; production native controls and ordinary TCP exposure
  are unchanged.
denial: Idle identity must fail ECONNRESET after the event, blocked calls must wake with errors, and FreeBSD
  must refuse new sockets until VM replacement. Ordinary host peer disconnect alone cannot satisfy the
  peerless-socket oracle; incomplete histories cannot emit a receipt.
