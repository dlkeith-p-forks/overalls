boundary: Ziggy counts a newly durable terminal spool completion, excludes caller cancellation and exports
  only fixed cumulative numbers through a private file, Rust exporter and Ziggy-only collector intake.
denial: Invalid or rejected admission cannot add a successful outcome; duplicate completion cannot count
  again; ordinary Ziggy UID cannot connect to the collector; guest identity and prompt content never become
  labels.
