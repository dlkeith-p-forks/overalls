gaps: No NixOS machine test drives the profile page or the browser connect param in the packaged browser;
  local-time lines inside LiveView streams refresh on re-read, not on the minute tick; the browser probe
  inherits pre-existing off-grid and thread appearance failures.
id: user-time-zones
journey: Choose a display time zone in the profile section of the account page, read every timestamp in
  that zone and see collaborators' local time
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Add a packaged-browser machine check that saves a zone, reloads and reads a converted timestamp,
  and a cross-session check that a collaborator sees the saved local time.
scope: Hegel properties over every curated zone and random instants including DST edges for label offsets,
  ordering, uniqueness, antisymmetric differences and validation; database round trips of the action;
  LiveView tests of the profile page, resolution order, dead render, UTC-provenance timestamps and people
  on team, machine, thread and Control room pages; Covenant obligations; synthetic browser probe of the
  profile page and an Adelaide timestamp. During integration through 9e7f6bd3, 49 focused tests passed,
  including actual persisted-token revocation refused on the next clock tick after correcting hook order.
  No native journey.
status: partial
