boundary: The zone is a nullable display preference on the user's own row, written only through the self-only
  set_time_zone action and validated against the compiled tz database; storage, ledger time, CSV export
  and SSH wire views stay UTC. The viewer zone resolves saved, then validated browser connect param, then
  UTC; other people's local time renders only from a saved zone.
denial: Refuse unknown or malformed zones with invalid_time_zone, non-user actors with Forbidden and retired
  accounts with unauthorized; required/security minute ticks first refuse revoked or expired persisted
  logins. Never persist the browser zone, log the zone text, show a person's local time without a saved
  zone, or add browser-only fields to SSH ls/show, share show or team show.
