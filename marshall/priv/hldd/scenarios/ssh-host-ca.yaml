boundary: Verified HTTPS policy and one dedicated host CA; issuance requires locked service or physical
  boot authority.
denial: Reject foreign principals, CA revocation, malformed or expired certificates and stale/cross-VM
  boot bindings.
evidence:
- assertion: 'certificate handshake and rekey: '
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/ssh-host-certificates/test.py
  record: docs/architecture/reviews/2026-09-25-unified-ssh-host-ca.md
  record_assertion: certificate; its script finished in 13.79 seconds.
  scope: Native OTP/OpenSSH across five key exchanges and refusal paths.
- assertion: reboot and cloning issue distinct keys under unchanged client CA trust
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/fleet/scenarios/user-ssh-journey.py
  record: docs/architecture/reviews/2026-09-25-unified-ssh-host-ca.md
  record_assertion: 257.80 seconds with unchanged CA trust and distinct leaf keys.
  scope: Full source-built NixOS and Ubuntu guest journey.
- assertion: issued host identities verify only at the signed principal, key, CA and interval
  execution: recorded
  kind: property
  path: protocol/test/ssh_host_certificate_test.exs
  record: docs/architecture/reviews/2026-09-25-unified-ssh-host-ca.md
  record_assertion: Protocol's certificate properties passed
  scope: Cryptographic binding and interval mutations.
- assertion: guest signing binds every boot field and derives only the authoritative endpoint
  execution: recorded
  kind: unit
  path: marshall/test/marshall/ssh/host_certificates_test.exs
  record: docs/architecture/reviews/2026-09-25-unified-ssh-host-ca.md
  record_assertion: with independent mutations of all six authority fields.
  scope: Guest bootstrap authority in PostgreSQL.
- assertion: initial certificate issuance recovers after the former start limit
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/installer-trust/driver.py
  record: docs/architecture/reviews/2026-09-25-unified-ssh-host-ca.md
  record_assertion: 98.24 seconds (real issuer outage/recovery in 49.43 seconds)
  scope: Porsche stays closed through seven failed initial issuance attempts, then obtains a real Marshall
    certificate and serves native SSH without manual reset.
gaps: Existing guest disks are intentionally excluded. Native macOS and a complete nested Inception deployment
  remain unverified. Production rollout is tracked separately in the execution review.
id: ssh-host-ca
journey: Install one SSH authority and connect to management, Audi and fresh NixOS or Ubuntu guests
layers:
- identity
- transport
- execution
- recovery
preferred_gap: Native NixOS/Ubuntu journeys and generated cryptographic refusals are recorded; retain
  those gates and add native macOS and complete nested Inception acceptance.
scope: Native OpenSSH transport; generated signatures and authority retries; installer, reboot, clone
  and relocation fleet scenarios.
status: covered
