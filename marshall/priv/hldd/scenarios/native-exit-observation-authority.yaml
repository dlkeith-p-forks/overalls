boundary: Volatile proof binds the exact currently verified VMM; one native observer may outlive proof
  withdrawal to report its actual terminal outcome, without granting authority.
denial: Negative evidence immediately withdraws proof; unavailable or unarmed targets retain the short
  backstop, stale ports cannot renew it, and a different boot target cannot inherit live authority.
