boundary: Native user-run client configuration and guest-local state remain separate from Marshall's platform
  agent loop; Lilly derives the VM binding and Marshall grants current inference authority. Codex starts
  with no approvals and danger-full-access; Claude starts with bypassPermissions and no Bash sandbox.
  Guest OS, VM, network and Marshall boundaries remain independent. Ubuntu retains the pinned offline
  application closure through its registered GC root.
denial: Dangerous client defaults remove prompts and client-level command sandboxing but cannot manufacture
  identity, revive stale execution, bypass Customer private-inference refusal or enable a disabled provider.
  Wrong CA trust or hostname must fail rather than disable TLS verification.
