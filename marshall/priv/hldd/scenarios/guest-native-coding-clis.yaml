id: guest-native-coding-clis
journey: Start the installed Codex or Claude Code from a guest terminal or SSH account using private Ziggy
  inference
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Retain the unexecuted device-only replacement branch, original unknown template-failure
  cause, focused/full native scope and failed production canary explicitly. Complete ADR-0111's same-root
  publication and both-host live Rustls/SSH obligations, then record renewed production canaries separately
  from activated source/images, offline proof and passing isolated-provider fixtures. Keep the deliberate
  dangerous-mode policy and its isolation limits explicit in future probes.
scope: Integrated core gates and exact enrolled-host image graphs passed; the exact Ubuntu rootfs rebuild
  reproduced bytes in 72 seconds. Both complete client fleets passed in NixOS 352.54 seconds and Ubuntu
  432.98 seconds, covering native personal-account PTY inference, separate curl beta counting, limited
  trust refusal, Customer no-effects refusal, root GC and registered verified SSH inference after GC.
  Fleet images differ from production artifacts. Marshall/static/Nix handbook and earlier complete NixOS
  native gates passed at c5747868. Complete corrected Ubuntu passed in 2,203.23 seconds with twelve subtests
  and final clone/cleanup guard. Focused current NixOS passed the exact 200-line prefix in 1,246.95 seconds,
  six subtests through original neighbour cleanup; later 161 lines retain earlier full-run scope. Both
  new actions exercised exact reuse only; device-only replacement remains unexecuted and original failures
  remain recorded. Corrected/refrozen packaged handbook rendering and reader revocation passed in 47.18
  seconds at its separately captured source; this does not add guest or production acceptance. Separately,
  published 8930a70f activated healthy on both hosts with matching fresh production image offers. Its
  first NixOS Codex canary timed out before any inference admission and was fully cleaned up; Ubuntu creation
  was not issued. Pinned public-chain rejection, isolated constrained Codex controls, same-root preparation
  and independently verified encrypted host replacements are distinct evidence scopes, without commit/push
  or live replacement claims for the leaf change. The current native settings also pin Codex approval_policy=never
  and sandbox_mode=danger-full-access plus Claude permissions.defaultMode=bypassPermissions and sandbox.enabled=false;
  native probes execute ordinary commands without launch flags. This does not establish host or VM isolation
  from a guest process.
