boundary: Nix provisions Grafana on Overalls loopback for operators. Application candidates repeat source
  lifetime and sampling-clock guards; ingress additionally requires fresh direct localhost source health.
  Guest claims cannot enter those series.
denial: Wrong operator credentials and remote-node access to Grafana refuse; missing, stale, too-young
  or wrong-host source markers withhold the candidate ratio, including when an older recording survives
  a Prometheus restart.
