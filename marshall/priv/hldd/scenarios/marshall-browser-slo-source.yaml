  scope: Current packaged verified-TLS HTTP response and independent Rust collector export, source UID/intake
    and exporter-write refusal, recorder SIGKILL without application restart, clean deployment coverage/totals
    continuity, and admitted producer loss with exactly one failure and no invented duration. The same
