boundary: Marshall counts endpoint responses only after the privacy, health and public machine-API prefilters;
  a mode-0640 cumulative snapshot in a dynamic-user-owned, mode-0750 directory feeds a static Rust exporter
  using the Marshall-only collector socket with a Nix-configured replica identity.
denial: Health probes and early machine-API refusals do not enter the denominator; request paths, credentials
  and user identity cannot become labels; the exporter cannot replace the source snapshot through directory
  permissions, and ordinary Marshall UID lacks direct collector socket group access.
