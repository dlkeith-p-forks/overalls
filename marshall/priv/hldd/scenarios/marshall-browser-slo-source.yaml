gaps: The current native browser retirement/refusal journey passes, but its own signed-in completed response
  has not been asserted at the collector. Native recorder loss, clean application restart and admitted
  producer loss preserve durable identity and settled totals; physical power loss, measured production
  targets and seven-day compliance remain open. VM creation completion is a separate journey.
id: marshall-browser-slo-source
journey: Observe a completed Marshall browser HTTP response as a candidate transport indicator
layers:
- identity
- transport
- isolation
- recovery
preferred_gap: Assert exact signed-in browser response export through the collector, then measure the
  live baseline before selecting a target; retain the passing native recorder/application-loss conservation
  oracles.
scope: Generated status and latency-bucket arithmetic, real in-process endpoint health exclusion and 404
  completion, a synthetic two-node collector fixture, a packaged Marshall HTTPS response exported through
  Rust, and one production public HTTPS 404 whose application-origin request and success counters rose
  from zero to one and reached central Prometheus. The source counter later reset on restart.
status: partial
