boundary: Marshall owns executor fences and transitions; the guest uses only verified private HTTPS. Native
  exec_command forwards the existing lease/stop callback before spawn and during authority polling. A
  separate scoped collector owns the child, concurrently bounds both output streams and enforces the 20-second
  deadline independently of a blocking lease RPC.
denial: A refused pre-spawn callback must create no child. Running refusal must cancel the separate process
  group, reap the direct child and discard output; execute must not publish a result under the failed
  lease. Missing/failed private authority and supervisor stop fail closed without logging command bytes.
