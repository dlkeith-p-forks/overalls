gaps: The historical OmniOS matrix failed services at clean-shutdown subprocess-timeout, crash at readiness-withheld
  protocol, and recovery/isolation at unchanged outer exit 124 bounds. Current-VMM isolation then failed
  boot 0's 20-second SSH shutdown-send request before the separate VMM wait; cleanup completed but no
  second boot or complete isolation receipt exists. Its cause is unestablished. Marshall-owned native
  fleet execution and production rollout remain open. Deliberate descendants escaping the process group
  are outside this cleanup guarantee. Local process tests and isolated synthetic native authority cannot
  establish physical host isolation or live control-plane revocation timing.
id: native-executor-current-lease
journey: Stop an executing native guest command when its current executor lease or supervisor authority
  is withdrawn
layers:
- identity
- authorization
- transport
- execution
- isolation
- recovery
preferred_gap: 'Run a NixOS machine history on each current native image: observe a started command, withdraw
  its actual lease or supervisor stop authority, prove its managed process group terminates and no result
  commits, then admit a fresh fence. Preserve bounded output and command-deadline checks during an unavailable
  lease endpoint.'
scope: The production native callback wiring and scoped cancellation/deadline collector are implemented.
  All six local real-process command tests passed, including no-spawn refusal, running cancellation/reaping/output
  suppression and a blocked lease RPC. Historical source-qualified OmniOS service evidence is retained.
  Fresh FreeBSD image 0150b6d1 passed all five exact-artifact scenarios against current VMM f0d9275b with
  executor withdrawal/cancellation and fresh-fence completion on every boot. Exact OmniOS 679f5f8b passed
  current-VMM services, growth, crash and daemon recovery with the same executor boundary on each complete
  service boot. Its isolation boot 0 reached those checks before shutdown-send failed; that incomplete
  scenario adds no complete receipt. Old-VMM results retain their separate scope.
