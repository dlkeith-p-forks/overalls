boundary: 'ADR-0192. Editor and nested HTTPS take ADR-0187''s detached path (record, op 14, keeper, re-adoption,
  ending through hostd). Lilly derives the stage from the validated binding: a PROXY v2 header naming
  the Audi-attested client for nested HTTPS, the framed editor binding and the exact framed ready document
  for the editor. hostd writes the preface to the guest and byte-compares exactly the expected frame''s
  length, reading no guest byte past it, before starting the bridge; it interprets neither string. TLS,
  HTTP and per-request editor grants stay with the client, the nested guest, Audi and Marshall.'
denial: hostd refuses an op 14 whose preface exceeds 4096 bytes, whose expected frame exceeds 256 bytes
  or whose ready wait is not 0 without a frame and 1..30000 ms with one, and starts no bridge when the
  guest closes, stays silent past the wait or sends any other frame. Editor sign-out still closes the
  WebSocket at Audi, which ends the bridge; a restarted Lilly ends unrecorded bridges and recorded ones
  whose execution is not current within 30 s. Marshall answers editor and web renewal while Lilly reconnects
  with unavailable, which Audi retries only inside the unchanged lease; sign-out, revoked write, stop,
  a newer generation and a stale report stay conclusive refusals.
