  scope: A scripted control channel answers unavailable twice and then the unchanged grant; the stream
    owner outlives its original deadline. unauthorized, forbidden and authentication_required end it at
    that renewal, before the deadline.
- assertion: live editor WebSockets survive lilly-hostd and Lilly restarts in detached bridges
  execution: present
  kind: machine
  path: nix/verification/tests/machines/vscode-web/fleet.py
  scope: 'With a live browser editor, restart lilly-hostd and then Lilly, each past the 30 s adoption
    grace: bridges holding the guest''s port 4444 sit in lilly_ingress.slice scopes and survive, every
    editor WebSocket stays open and receives frames afterwards, and a fresh editor request succeeds. Present;
    its first run failed on Marshall''s renewal refusal, and the corrected subtest has not run.'
gaps: The editor fleet restart subtest's first run failed because Marshall pinned the editor lease to
  Lilly's replaced control session and refused renewal while Lilly reconnected; the corrected subtest
  has not run. Nested HTTPS has unit and property evidence only, and its renewal still pins the host session
  through its publication, so a nested HTTPS stream survives a hostd restart but not a Lilly restart.
  Nested porsche_ssh and audi_ssh renewal has the same publication binding. hostd, a root process, reads
  up to 256 guest bytes for the editor's ready frame; moving the stage into the unprivileged bridge is
  an open question. A detached editor's scope start now follows the guest's ready frame inside Audi's
  unchanged 22 s handshake bound.
id: staged-detached-ingress-survival
