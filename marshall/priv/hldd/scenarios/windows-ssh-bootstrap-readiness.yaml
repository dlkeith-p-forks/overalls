boundary: Bootstrap-bound roster and host-certificate routes retain their existing fences. A new boot
  stops sshd, clears only regular direct entries in the managed key directory and requires a verified
  current-boot host certificate before starting its keyless listener and publishing the bootstrap receipt.
  Every readiness poll requires both current receipts and a live service. Ordinary key delivery still
  requires the running execution's completed provision/start operation. Account activation verifies the
  SID-bound registered profile after the MAX_PATH-bounded native API call; same-boot retries preserve
  current keys.
denial: Missing, stale or unreadable bootstrap/certificate receipts, service probe errors, failed profile
  registration, reparse points, unexpected key directories and failed cleanup withhold bootstrap/readiness.
  Bootstrap never authorizes the ordinary key route before completed start. A denied key fetch does not
  erase current-boot keys or retract a completed keyless bootstrap.
