gaps: Portable coordinator tests do not execute Windows SCM, profile creation or network listeners. Actual
  installation/readback establishes the repaired image bytes, not its physical lifecycle. Selected-image
  deployment and fresh exact-image create, strict CLI SSH, stop/restart/repeated SSH and cleanup remain
  separate. Scheduled-task crash recovery, hostile filesystem races and physical isolation remain unproven.
id: windows-ssh-bootstrap-readiness
journey: Complete Windows SSH bootstrap before ordinary key delivery and withhold readiness when bootstrap
  evidence is missing
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Add a repeatable NixOS machine test driving the real Windows tasks through new-boot stale
  keys, denied ordinary key delivery before completed start, certificate replacement, profile API failure
  and same-boot recovery. Retain full exact-image live lifecycle results separately from that machine
  scope.
scope: The frozen Lyra gate passed 223 portable tests with Linux Clippy, Windows all-binary type checks
  and FreeBSD/illumos checks and Clippy. Actual shared readiness-answer cases cover absent/stale receipts,
  stopped/erroring services and foreign peers. The production bootstrap coordinator is tested with an
  ordinary-key fixture denied until completed start, stale-key cleanup refusal and same-boot preservation.
  Two isolated mutants, retaining prior keys and allowing readiness without a marker, were caught. A separate
  native CreateProfile diagnostic reproduced the 4096-unit RPC failure and successful 260-unit SID registration
  in the owned disposable old-image fixture; the old agent then enabled the account and started sshd.
  That fixture was mutated and is not an unchanged-image lifecycle pass. The repaired exact 8ca0a11f image
  then passed actual installation in 1,834.2 seconds and immutable NTFS readback of all three repaired
  executables; sealed no-reference NAR custody is recorded separately. Signed cache publication and exact
  NAR-fingerprint Ed25519 verification also passed; independent fresh Dungarees substitution, full NAR
  content verification, manifest/canonical identity and whole disk/firmware hashes then passed. Source
  selection pins those exact reviewed bytes; deployment and fresh runtime remain pending.
status: partial
