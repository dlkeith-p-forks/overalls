boundary: Arch Linux and AlmaLinux use the version-4 kernel image shape with distinct pinned distribution
  roots and identities. Owned key-only SSH policy, pinned PAM modules and a requisite private login receipt
  preserve the existing Audi authority. Collision-checked locked sshd/overalls-ssh identities, files-only
  account lookup and pinned account command paths preserve roster custody. Root-owned regular setuid sudo
  uses only reconciler-managed per-user grants; vendor sshd enablement resolves to the readiness-gated
  listener. The root-only argument-free helper oneshot installs exact pinned immutable unix_chkpwd bytes
  at its compiled path before SSH, requiring regular root-owned source/destination and safe root-owned
  parents. Existing nosuid mounts remain; the pinned root PAM caller sets real UID 0 before helper execution.
  Marshall authorization, current-boot readiness, host isolation and native storage remain independent
  existing boundaries.
denial: Missing distribution/contract inputs or malformed, colliding or exhausted system-account allocations
  refuse assembly. Helper arguments, nonroot callers, symlink/foreign/writable parents or unsafe source/destination
  custody refuse installation; SSH requires helper success. Isolated root-account checks preserve expired,
  password-change and unknown-account refusals. No password/root SSH path or vendor policy may replace
  the owned listener; absent current roster/login authority must refuse guest access. Evaluation and allocator
  tests do not establish live roster/revocation refusals or general distribution-native runtime support.
