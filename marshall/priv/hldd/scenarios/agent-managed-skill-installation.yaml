- assertion: extracts_real_blobs_without_running_attributes_filters_or_hooks
  execution: present
  kind: unit
  path: lyra/src/agent/managed_skills.rs
  scope: Local real-Git fixtures exercise ordinary blob extraction without checkout hooks or configured
