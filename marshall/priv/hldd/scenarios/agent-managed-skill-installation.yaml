- assertion: queued managed skill installation is dispatched and completed by another process
  execution: recorded
  kind: unit
  path: marshall/test/marshall/agents/agent_context_recovery_distributed_test.exs
  record: docs/architecture/reviews/2026-10-16-agent-context-and-planning.md
  record_assertion: distributed recovery suite passed
  scope: The distributed fixture stops writer and dispatcher peers, then completes the queued operation
