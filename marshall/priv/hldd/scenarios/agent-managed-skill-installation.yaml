boundary: Current thread managers configure managed installations; operators invoke enabled versions.
  Ash resources own immutable request identity and pinned revision metadata, while fenced guest operations
  fetch and materialize immutable revision directories outside repository discovery roots.
denial: Refuse nonmanager mutations, stale execution, private credentials, unapproved repository hosts,
  traversal, changed replay input and unexpected digest. Fetching runs no hooks, filters, submodules or
  installation scripts. Failed updates retain the active revision; managed removal cannot erase personal
  or project skill files or locally edited content.
