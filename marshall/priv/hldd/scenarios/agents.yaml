boundary: Write permission, profile tool allowlist, model claim and boot-bound executor fence.
denial: Reject a model response containing any forbidden tool, reject stale executor authority and a late
  completion after claim expiry, and refuse changed prompt text under an already used request key without
  another turn or wake.
evidence:
- assertion: model poll stops after version refusal
  execution: present
  kind: property
  path: ziggy/test/version_refusal_test.exs
  scope: Generated transient poll prefixes before 426 and repeated post-fence poll messages; no new model
    task in the local worker. No live Marshall or provider
- assertion: claimed model work never requeues across the expiry boundary
  execution: present
  kind: property
  path: marshall/test/marshall/agents/model_calls_test.exs
  scope: Generated one to four repeated polls on each side of the ten-minute claim expiry with a database-clock
    oracle; local Ash/PostgreSQL and synthetic provider response only
- assertion: prompt retries join one wake without duplicating turns or starting a guest
  execution: present
  kind: property
  path: marshall/test/marshall/agents/prompt_wake_property_test.exs
  scope: Generated running, pending, stopped and paused prompt histories use a fresh SQL sandbox per case;
    one turn, event and durable wake identity, with no premature execution. Synthetic capacity and no
    native guest wake.
- assertion: any forbidden call rejects a whole generated model response
  execution: recorded
  kind: property
  path: marshall/test/marshall/agents/capabilities_test.exs
  record: docs/architecture/reviews/2026-09-23-agent-capabilities.md
  record_assertion: '`mix precommit` passed with 910 tests'
  scope: Generated mixed tool responses.
- assertion: shared operator prompt wakes guest and completes model tool round trip
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/fleet/scenarios/agent.py
  record: docs/architecture/reviews/2026-09-23-agent-threads-foundation.md
  record_assertion: full `agent-fleet` guest round trip
  scope: Real stopped guest, Marshall, Ziggy and tool executor with fixture model.
- assertion: capabilities == expected_capabilities
  execution: present
  kind: machine
  path: nix/verification/tests/machines/fleet/scenarios/agent.py
  scope: The real Firecracker Lyra executor registration exposes exactly the artifact staging, attachment,
    context inventory/read, GitHub tool and managed-skill capabilities, stored sorted; no prompt, file content
    or credential is inspected. The agent-fleet run passed locally on 2026-10-21 without an execution record.
gaps: Native browser-approved CLI journeys are recorded under the agent-cli scenario; this row retains
  its generated-matrix, SQL-backed prompt/claim and deterministic-provider scopes. Concurrent same-key
  prompt and model claims, lost replies and actual provider effects remain open. Native hostile-tool/profile
  permutations and Ubuntu browser-approved CLI remain open; live external providers remain an excluded
  boundary. A live Marshall version-skew deployment and already-active provider tasks remain outside the
  local poll test.
