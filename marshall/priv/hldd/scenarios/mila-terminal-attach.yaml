boundary: Mila attaches with terminal attach on a PTY through Porsche, resumes from its byte cursor, and
  fences input locally when read-only; Marshall and Porsche authorize the attach.
denial: Output before the header is dropped; a read-only attachment sends no keys, paste or resize; refused,
  invalid and authority exits end the view; transport retries stop after 8 attempts.
