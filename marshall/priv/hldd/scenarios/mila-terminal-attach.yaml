  scope: Hegel StateMachine over attach, header, output, end, reset and read-only events.
- assertion: the stderr header, output and exit become signals in order
  execution: present
  kind: unit
  path: mila/packages/mila_transport/test/channels_test.dart
  scope: In-memory stderr/stdout/exit streams.
- assertion: terminal attach runs on a pty sized to the view, with resize and exit mapping
  execution: present
  kind: unit
  path: mila/packages/mila_transport/test/ssh_porsche_test.dart
