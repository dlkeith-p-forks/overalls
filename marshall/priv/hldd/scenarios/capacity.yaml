gaps: Local insert faults and recorded post-commit worker/BEAM loss with concurrent three-node retries
  do not cover pre-commit ambiguity, HTTP reply loss, optional workspace-source or Inception environment
  writes, or native job execution. The poison-command test does not cover Lilly's response to that durable
  409, retained relocation-cleanup obligations or a policy decision on whole-host report starvation. The
  Lilly transient property injects handler results and does not run client retry, a real partition or
  Marshall freshness recovery. These checks do not establish fleet-wide production throughput or arbitrary
  overcommit tuning.
id: capacity
journey: Admit work without double-spending capacity
layers:
- execution
- storage
preferred_gap: Keep native admission races and generated accounting properties; add a cross-service partition/heal
  journey through Lilly retry and Marshall report freshness, native commit-ambiguity and optional-write
  failure journeys, test Lilly poison-exchange backoff and retained cleanup recovery, then measure load
  separately.
scope: Generated multi-node admission histories against a committed raw-SQL accounting oracle, local insert-failure
  histories with exact committed row inventory, generated archived same-key replay and changed-shape histories
  with complete allocation inventory, generated storage-accounting and host report ordering cases, generated
  authenticated poison-command exchange rollback and owner-stop recovery, local Lilly transient-failure/status
  recovery histories, and native fleet capacity admission races. A separately captured 2026-10-13 KVM
  ZFS I/O run kept measured capacity available when independent pool rates were unavailable under malformed,
  timeout and export/import faults.
status: partial
