boundary: Audi supplies the trusted local execution binding; Peach uses its dedicated host credential;
  Marshall alone derives current machine and integration authority
denial: Malformed or foreign host bindings, stale execution, stopped or retired machines, expired or revoked
  Peach credentials and disallowed profiles must refuse without returning a retained projection or secret
  header values
