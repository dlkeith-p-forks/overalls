preferred_gap: Run the page's PowerShell command on a Windows Server 2025 fleet VM, connect to a Linux
  and a Windows guest, and observe an update activation; record it in the review.
scope: Rust unit tests pin Windows ProxyCommand quoting, the windows-amd64 target name and the portable
  UTC date; the Lyra Nix check type-checks the overalls binary for x86_64-pc-windows-gnu; the release
  publishes a PE32+ windows-amd64 artifact in the manifest; a Nix check parses install.ps1 with PowerShell
