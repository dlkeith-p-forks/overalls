boundary: Marshall serves /bin/install.ps1 templated with the deployment's SSH host trust (503 without
  it) and the windows-amd64 artifact with its SHA-256 digest from the same manifest as the Unix targets.
  The installer validates origin, zone and host against the issued values, requires an OpenSSH client
  with hostname protection (9.6+), installs Microsoft.OpenSSH.Preview with winget without asking when
  %ProgramFiles%\OpenSSH lacks one, and with one administrator approval places %ProgramFiles%\OpenSSH
  before the in-box 9.5 directory in the machine PATH (resolved in the elevated process; declined elevation
  leaves the machine PATH unchanged and points to overalls ssh) so the machine page shows one ssh HOST
  command, verifies the digest, runs config-ssh --staged-installer with the downloaded binary before installing
  it, and connects with overalls ssh through the recorded client. The managed SSH block quotes ProxyCommand
  as one double-quoted absolute path because Win32-OpenSSH runs it without a shell. Updates use the same
  digest manifest and activate by renaming the running executable aside.
denial: A non-https origin, a foreign management host or zone, or a host outside the zone is refused before
  any download; a digest mismatch or failed SSH configuration leaves the installed binary and SSH profile
  unchanged; a client without hostname protection stops setup; an executable path containing a double
  quote is refused for ProxyCommand.
evidence:
- assertion: windows_proxy_command_is_one_double_quoted_path
  execution: present
  kind: unit
  path: lyra/src/ssh_config.rs
  scope: 'ProxyCommand quoting for Win32-OpenSSH: one double-quoted path, percent doubled, quotes and
    control characters refused; no SSH client runs.'
- assertion: PowerShell installer is deployment bound, verifies the digest and gates OpenSSH 9.6
  execution: present
  kind: unit
  path: marshall/test/marshall_web/controllers/overalls_controller_test.exs
  scope: Marshall renders /bin/install.ps1 with the deployment host and zone, no-store and without cookies,
    and refuses it without trust; no PowerShell runs.
- assertion: origin does not match this installer
  execution: present
  kind: unit
  path: nix/verification/tests/overalls-install-ps1.nix
  scope: PowerShell parses the installer and it refuses bad origins, hosts and zones before any network
    access; no Windows host or OpenSSH.
gaps: 'No execution on a real Windows workstation yet: unattended winget OpenSSH installation, the elevated
  machine PATH reordering and its declined-elevation fallback, config-ssh against Porsche, overalls ssh
  into Linux and Windows guests, overalls open and an update activation by rename-aside are unexercised;
  the planned proof uses a Windows Server 2025 fleet VM as the workstation.'
id: windows-workstation-client
journey: Install the overalls CLI on a Windows workstation from the machine page and SSH into Linux and
  Windows guests through Audi
layers:
- identity
- authorization
- transport
- storage
