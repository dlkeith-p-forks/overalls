boundary: Fleet public addresses live only in secrets/fleet-addresses.enc.json; overalls-fleet-addresses
  validates every value before the runtime firewall chain, WireGuard endpoints, uplink drop-in and service
  binds use it; Overalls admits salopettes' handshake only from its decrypted address and resolves notifications.overalls.dev
  to 10.90.0.3.
denial: A missing, malformed or wildcard address keeps every runtime rule, endpoint and listener closed;
  a rotation flushes before admitting; an unreadable document leaves a dedicated host on its root-only
  uplink recovery copy; static IPv4 address or route literals beside a runtime uplink are refused at evaluation.
