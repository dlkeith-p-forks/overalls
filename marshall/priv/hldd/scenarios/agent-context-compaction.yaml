boundary: Agents owns immutable context snapshots and covered-prefix checkpoints independently of retained
  transcript events. Existing Ziggy admission/accounting and current generation/frontier checks govern
  model effects and publication. Eligible-turn coverage must exclude queued later prompts and include
  accepted continuation exactly once.
denial: Refuse oversized required instructions/current input, orphaned tool groups, stale or incomplete
  checkpoint results and no-progress compaction. Unknown native capability uses summary mode. A generated
  summary cannot change trusted mode or permissions. Ambiguous claimed model calls cannot be replayed
  automatically.
evidence:
- assertion: completed tool groups are either entirely summarized or entirely retained
  execution: present
  kind: property
  path: marshall/test/marshall/agents/compaction_test.exs
  scope: Generated pure request groups assert that compaction does not split a completed function call
    from its result; no database or provider execution is included.
- assertion: only bounded completed purpose-specific output can become a checkpoint
  execution: present
  kind: unit
  path: marshall/test/marshall/agents/compaction_test.exs
  scope: Pure completion validation rejects malformed or incomplete summary/native output before checkpoint
    publication.
- assertion: unknown native support uses tool-free summaries and keeps instructions outside generated
    state
  execution: present
  kind: unit
  path: marshall/test/marshall/agents/compaction_test.exs
  scope: Pure request construction selects the summary fallback without verified native support and preserves
    separate trusted instructions.
- assertion: a compaction plan can be reconstructed by another process after worker loss
  execution: recorded
  kind: unit
  path: marshall/test/marshall/agents/agent_context_recovery_distributed_test.exs
  record: docs/architecture/reviews/2026-10-16-agent-context-and-planning.md
  record_assertion: distributed recovery suite passed
  scope: The distributed fixture stops the compaction worker and reconstructs the checkpoint and plan
    through a replacement peer using committed PostgreSQL state; no guest or provider is involved.
gaps: SQL checkpoint publication races, queued-prompt interleaving, native Marshall-to-Ziggy/provider/guest
  composition and live provider capability acceptance remain unverified. Process-peer recovery observes
  committed state but does not establish independent-host or guest recovery.
id: agent-context-compaction
journey: Continue a long thread through automatic or requested context compaction
layers:
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Execute generated SQL checkpoint/replay histories and a NixOS Marshall-to-Ziggy-to-provider-fixture-to-guest
  continuation including claim loss, stale completion and repeated compaction; verify live native compaction
  separately before enabling it.
scope: Pure compaction tests, generated complete-tool-group coverage and a distributed process-loss reconstruction
  fixture are present. The distributed fixture stops the admitting peer and reconstructs the checkpoint
  and compaction plan from committed PostgreSQL state through replacement peers; it does not run a guest
  or provider.
status: partial
