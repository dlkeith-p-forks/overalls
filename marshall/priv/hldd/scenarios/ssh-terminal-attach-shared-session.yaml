boundary: Porsche obtains a single-use ticket bound to the SSH session through the control link, then
  opens Marshall's gateway stream with the gateway bearer and SSH session; the stream upgrades into the
  production terminal viewer.
denial: An unknown or another machine's session exits 1 (not_found); attach without a pty exits 2 before
  any ticket is requested; a browser ticket on the gateway route, or an SSH ticket on the browser route,
  closes 4003.
