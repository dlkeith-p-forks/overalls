boundary: Porsche dispatches the shared-parser command under Marshall session authority; the Threads domain
  checks thread read/write with the SSH actor; prompt, answer and revision text arrives only as a bounded
  stdin payload and receipts keep only its digest and the SSH key id.
denial: A payload command without stdin, an oversized or empty payload, a busy thread, a stale proposal
  or question, invalid answers and a stranger's thread refuse with closed reasons before any turn is admitted;
  a reused request id with different text is idempotency_conflict.
evidence:
- assertion: client commands format to canonical lines that parse back unchanged
  execution: present
  kind: property
  path: protocol/test/ssh_client_commands_test.exs
  scope: Canonical line form round-trips and mutation classification for all 15 commands.
- assertion: stdin payloads are bounded valid text and never accepted on the command line
  execution: present
  kind: property
  path: protocol/test/ssh_client_commands_test.exs
  scope: Stdin payload kinds, limits and command-line refusal.
- assertion: thread commands list, show, prompt and mark read through the domain
  execution: present
  kind: unit
  path: marshall/test/marshall/ssh/client_commands_test.exs
  scope: Dispatch, unread counts, digest-only receipts with SSH key id, replay and conflict.
- assertion: thread answer and plan commands keep the domain's question and proposal fences
  execution: present
  kind: unit
  path: marshall/test/marshall/ssh/client_commands_test.exs
  scope: Planning question answer, stale proposal refusal and plan approval into a Work turn.
- assertion: exec reads prompt payloads from stdin within their bound
  execution: present
  kind: unit
  path: porsche/test/ssh_channel_test.exs
  scope: OTP SSH exec channel buffers, bounds and validates the prompt payload.
- assertion: 'porsche-threads: stdin prompts, thread reads and a revocable watch'
  execution: present
  kind: unit
  path: marshall/test/marshall_web/ssh_transport_test.exs
  scope: Real OpenSSH-protocol client, Porsche listener and Marshall control over verified TLS in one
    BEAM.
- assertion: Porsche thread, web and watch commands drive Marshall domains
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/fleet/scenarios/porsche-threads.py
  record: docs/architecture/reviews/2026-10-19-mila-m6.md
  record_assertion: '`porsche-threads` passed'
  scope: Native OpenSSH, packaged Porsche and Marshall on the fleet fixture.
gaps: Committed-hint delivery to a watch is not exercised end to end; the fleet has no model provider,
  so turns only queue and fixture actions stand in for the model's question and plan tool calls.
