boundary: The host boot-log writer stamps console lines without interpreting payloads under its 1 MiB
  cap; the guest boot report is observation only. Ubuntu skips update-ca-certificates only when the marker,
  managed root bytes, bundle PEM blocks and per-root links prove the store already reflects the exact
  delivered set; every boot still delivers and verifies the current host set before networking (ADR-0113,
  ADR-0154).
denial: 'Any marker mismatch, changed, extra or missing managed root, missing bundle block or link, or
  failed rebuild takes the full replace path: the marker is withdrawn before mutation and written only
  after update-ca-certificates verifies. A retired root fails bundle and CApath verification after the
  next boot.'
evidence:
- assertion: stamping_is_chunking_independent
  execution: recorded
  kind: property
  path: lilly/native/boot-log/src/tests.rs
  record: docs/architecture/reviews/2026-10-10-guest-boot-profile.md
  record_assertion: 'lilly-boot-log: 13 passed'
  scope: Generated console bytes and chunkings stamp identically to the whole buffer and to an independent
    line oracle; prefix stripping recovers the input. Pure writer logic; no VMM or guest.
- assertion: ubuntu_rotation_and_every_drift_take_the_full_path
  execution: recorded
  kind: unit
  path: lyra/src/bin/overalls-trustd.rs
  record: docs/architecture/reviews/2026-10-10-guest-boot-profile.md
  record_assertion: overalls-trustd receiver tests 8 passed
  scope: 'Temporary-store receiver cases with an update-ca-certificates emulator: identical delivery is
    a no-op, rotation and five drift kinds rebuild, a failed rebuild withdraws the marker. Does not run
    the real Ubuntu tool.'
- assertion: a restart retiring that root removes it from the guest trust store
  execution: recorded
  kind: machine
  path: nix/verification/tests/machines/zfs-guest/boot-profile.py
  record: docs/architecture/reviews/2026-10-10-guest-boot-profile.md
  record_assertion: passed with all subtests
  scope: Real Firecracker NixOS and Ubuntu guests booted three times through Lilly trust delivery; boot
    report printed each boot; bundle membership after each delivery and Ubuntu CApath accept/refuse for
    present/retired roots. Nested KVM, isolated from Audi.
gaps: Nested-KVM 1-vCPU fixture timings only; no fleet-hardware measurement. ADR-0154's accepted at-most-30-second
  completion wait is unimplemented across in-flight tool timeouts; a controlled runner waited 40.25s,
  requiring a timeout-budget correction/regression. Isolated fixtures cannot finish booting without Audi,
  so systemd-analyze time is observed only on the NixOS image without private services. No curl verification
  against a platform-issued leaf certificate in this journey.
id: guest-boot-profile-trust-fast-path
journey: See where a guest boot spends its time and boot faster without weakening boot-bound trust
layers:
- identity
- transport
- recovery
preferred_gap: Enforce the accepted completion-wait bound with a scoped timeout regression, record boot
  reports from fleet NixOS and Ubuntu creates after deployment, and add an issued-leaf TLS check to the
  rotation journey.
scope: Hegel properties prove chunking-independent stamping and exact bounded retention. Rust unit cases
  cover the receiver's no-op, rotation, drift and failed-rebuild paths. Native boot-profile journeys on
  NixOS and Ubuntu boot through Lilly's real trust delivery with identical, added and retired root sets,
  verifying the guest bundle (and Ubuntu CApath links) after each boot.
status: partial
