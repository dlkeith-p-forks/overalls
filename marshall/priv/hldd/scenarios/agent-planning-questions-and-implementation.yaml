boundary: Persisted Plan/Work collaboration is trusted application state separate from reasoning. Root
  Plan turns own durable questions and the first current authorized answer. A completed proposal binds
  one Work turn on the same thread and machine. Plan is instructional and does not create a read-only
  filesystem boundary.
denial: Viewers and revoked actors cannot answer or implement. Child agents cannot ask human questions.
  Stale, cancelled, archived or nonactive requests refuse. Competing answers cannot overwrite a winner,
  changed replay inputs conflict and partial proposal output cannot be implemented. Mode changes while
  work runs or awaits answers refuse.
