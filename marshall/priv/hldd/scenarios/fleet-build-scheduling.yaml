boundary: Panterloons alone runs the hub and has no build machines; Dungarees delegates only to Panterloons'
  mTLS grpc:// store. Tribuchet workers need a tribuchet-CA leaf; grpc peers need build-NAME from a separate
  CA, with trusted only for Dungarees on Panterloons and read-only the other way. Listeners are reachable
  only through tailscale0; keys come from per-host SOPS bundles; global signature checks stay for other
  substituters (ADR-0248).
denial: An unmatched grpc CN is denied, the read-only peer cannot open the worker-protocol tunnel or import
  unsigned paths, and a worker certificate from another CA fails the hub handshake. With the hub or the
  scheduler's grpc daemon down, builds run locally instead of failing.
