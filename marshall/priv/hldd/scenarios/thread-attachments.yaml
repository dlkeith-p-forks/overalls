id: thread-attachments
journey: Upload a thread-owned file, retry a failed write, and download it under current thread authority
boundary: PostgreSQL owns attachment identity and lifecycle. Current thread Cedar permissions authorize writes and reads; encrypted blob storage grants no authority. Browser transfers require a persisted login and CSRF protection.
denial: Refuse malformed identifiers, unauthorized uploads, changed retry content, missing encryption keys, expired or consumed download tokens, and revoked thread or login authority.
status: partial
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
scope: Sequential database histories and controller fixtures exercise metadata lifecycle, content identity, retry recovery and current permissions. These are BEAM test VM results, not production storage or guest transfer acceptance.
evidence:
- assertion: audit insert failures roll back the complete buffered upload
  execution: recorded
  kind: property
  path: marshall/test/marshall/agents/attachment_history_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: ExUnit seed 504506
  scope: PostgreSQL trigger faults at begin, chunk and finish receipts leave no attachment, chunk or audit rows and permit a fresh retry. Sequential sandbox only; token-specific faults and replica failures remain open.
- assertion: durable uploads preserve per-key identity across retries and conflicts
  execution: recorded
  kind: property
  path: marshall/test/marshall/agents/attachment_history_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: ExUnit seed 829229
  scope: Fresh SQL sandboxes exercise empty files and chunk boundaries, two independent retry keys, changed content refusal and exact byte redemption against an independent content-identity model.
- assertion: upload histories preserve content identity and recover failed writes
  execution: recorded
  kind: property
  path: marshall/test/marshall/agents/attachment_history_test.exs
  record: docs/architecture/reviews/2026-10-20-thread-attachments.md
  record_assertion: in 8.8 seconds (ExUnit seed 392305)
  scope: Generated sequences use fresh SQL sandboxes and local blob directories; an independent model checks identity, digest, size, state and stored bytes across conflicting retries and unavailable encryption configuration.
- assertion: upload persists available metadata through resource transitions
  execution: present
  kind: unit
  path: marshall/test/marshall/agents/attachment_tool_test.exs
  scope: Shared readers, revoked grants, actor-bound token redemption, outer rollback and failed storage retry use one sandbox connection.
- assertion: older executors refuse attachment work with one failure receipt
  execution: present
  kind: unit
  path: marshall/test/marshall/agents/executor_session_test.exs
  scope: An executor without attachment capability refuses queued work once and records a single terminal tool outcome.
gaps: Guest upload/download execution has focused local and coordinator tests, but no recorded real-machine end-to-end acceptance. Durable shared storage, rotating production keys, comprehensive durable security audits, orphan cleanup, independent-connection races and native transfer acceptance remain unfinished.
preferred_gap: Extend generated histories to permission changes and competing independent connections, then run a NixOS machine journey with guest file upload/download, revoked authority, storage interruption and replica failover.
