id: integrations
journey: Attach and withdraw integrations, renew open requests and authenticate peer VM traffic
layers:
- authorization
- transport
- execution
preferred_gap: Recorded generated authority and response histories, packaged faults and actual native
  policy withdrawal passed. Production explicit direct/peer attachment and stalled-origin withdrawal passed
  separately; production control-fault injections and independent physical-host failures remain separate.
scope: Native cross-host guest path, detach, source stop and all-Marshall outage; captured ordinary membership/attachment
  withdrawal after successful renewal with exact refusal, socket closure, no retry and restored fresh
  success; generated local TLS upload source failures with bounded per-path origin handler counts and
  generated renewal refusal, invalid TTL and expiry histories with no response bytes. Generated Galileo
  control reply and verified TLS route histories retain HTTP 426 as a distinct version refusal. Recorded
  production CLI/Chromium management, actual credential injection/replacement, membership/attachment withdrawal
  and independent physical-host relocation with peer traffic in both directions. Verified control403 propagates
  as guest403 before upload/upstream effects; invalid/outage replies remain guest503.
