boundary: Secrets arrive only through the host-bound SOPS bundle and systemd credentials; the audit trail
  is append-only and hash chained.
denial: Another host cannot decrypt the bundle; a missing secret keeps the previous bundle and fences
  startup; unsafe credential files and invalid keyrings refuse startup; UPDATE/DELETE/TRUNCATE on audit
  rows fail.
