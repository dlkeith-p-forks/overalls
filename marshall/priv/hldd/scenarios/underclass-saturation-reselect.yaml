boundary: The pinned Underclass proxy refuses with 429 and a relative Retry-After only when a fresh selection
  after the automatic reset attempt still finds no healthy eligible account; requests skip the reset lock
  while any Codex account is healthy.
denial: When every eligible account is still cooling after the reset attempt, the request is refused with
  429 and Retry-After equal to the seconds until the earliest cooling deadline; no credential or prompt
  enters the saturation log.
