boundary: Nix configuration trusts only the pinned Overalls Cachix signing key for the additional read
  substituter. The NixOS host catalog, NixOS guests, kexec installer and Ubuntu nix-daemon share the declaration;
  fleet publication uses a separately scoped SOPS token under ADR-0189, and guests receive no publication
  credentials.
denial: Reject substituted paths when signatures are disabled or the Overalls key is absent. A Cachix
  outage falls back to cache.nixos.org or a local build; foreign images without Nix are outside this journey.
evidence:
- assertion: configured
  execution: present
  kind: unit
  path: nix/verification/tests/evaluation/nix-cache.nix
  scope: The flake evaluation check passed for host, guest and all declared fleet fixtures; it also rejects
    a forced require-sigs=false configuration.
gaps: No recorded physical host/guest run demonstrates a Cachix hit or outage fallback. Cache freshness,
  availability and deployment convergence remain unverified.
id: signed-nix-cache-fallback
journey: Build a host or guest closure with the signed Overalls Nix cache
layers:
- authorization
- transport
- execution
- recovery
preferred_gap: Run a NixOS machine journey that forces a known signed closure through Cachix, then blocks
  the endpoint and records successful upstream or local fallback while preserving signature refusal.
scope: Evaluation evidence covers the shared host module, NixOS guest, fleet fixtures and signature policy.
  It does not establish live Cachix reachability, substitution hit rate or physical rollout.
status: partial
