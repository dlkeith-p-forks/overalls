boundary: The platform profile selects hardware custody (Secure Enclave on signed macOS, a non-exportable
  CNG key on Windows with TPM or software provider) or owner-only software keys only for unsigned dev
  builds; Mila's files are owner-only through POSIX modes or a protected user-and-SYSTEM DACL on Windows.
denial: A release build that carries the software-keys define refuses to start; a Windows file whose DACL
  is inherited, unprotected or grants any other SID is refused rather than read; a POSIX file other users
  can read is refused.
evidence:
- assertion: an allow entry for any other SID is refused
  execution: present
  kind: property
  path: mila/packages/mila_transport/test/owner_only_test.dart
  scope: Hegel over generated SIDs and access masks against the SDDL checker; host-independent.
- assertion: a written file is owner-only and refused once shared
  execution: present
  kind: unit
  path: mila/packages/mila_transport/test/owner_only_test.dart
  scope: Windows-only icacls grant to Everyone after a protected write.
gaps: No signed macOS build, no Windows native key channel and no Windows CI host; Secure Enclave and
  TPM custody are unverified on desktop.
id: mila-desktop-custody
journey: A user installs Mila on macOS or Windows, signs in to a deployment and keeps its device key,
  pins and offline list on that machine
layers:
- identity
- storage
- isolation
preferred_gap: Add Windows and macOS CI jobs that run the transport suite natively, plus an XCTest and
  CTest for the native key channels; no NixOS machine test can host macOS or Windows clients.
scope: Dart unit and Hegel property tests over the SDDL builder and checker on every host, an icacls round
  trip that runs only on Windows, and macOS unsigned dev builds launched locally with 0700/0600 data files
  observed. The Windows CNG/TPM channel and Secure Enclave on a signed macOS build are not implemented
  or not exercised.
status: partial
