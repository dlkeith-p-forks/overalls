  execution: recorded
  kind: property
  path: nix/domains/system/otel-guest/receiver/src/underclass_probe.rs
  record: docs/architecture/reviews/2026-09-28-fleet-otel-baseline.md
  record_assertion: generated monitor freshness and accounting property
  scope: Generated monitor timestamps, counters and bin lengths refuse stale, inconsistent or incomplete
    snapshots; fixed OTLP identity has a separate unit assertion.
