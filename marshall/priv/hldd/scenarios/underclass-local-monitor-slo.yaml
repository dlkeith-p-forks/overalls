boundary: A host-owned Rust probe calls only the pinned Underclass tokenless local Unix monitor; a separate
  collector intake assigns fixed Underclass-monitor and host provenance before Prometheus and private
  Grafana read it.
denial: Malformed, stale, oversized or failed monitor responses produce an observed zero. A missing host,
  incomplete scrape window, stale probe, or unavailable collector makes the candidate unknown instead
  of healthy; other application UIDs cannot write the Underclass collector socket.
