    one.
gaps: Local monitor readiness is not authorized proxy completion, tailnet availability or a live-provider
  result. A provisional monitor target exists, but full seven-day production coverage remains unverified.
id: underclass-local-monitor-slo
journey: Read a guarded candidate for Underclass local monitor availability on both hosts
layers:
- identity
- transport
- isolation
- recovery
preferred_gap: Instrument admitted proxy completion at the pinned Underclass source and test the tailnet
  plus provider path with native evidence before promoting a final objective.
scope: Rust properties cover response freshness and bounded fixed telemetry. Promtool checks observed
  zero, missing host, incomplete scrape coverage and retained-recording refusal. A two-node NixOS fixture
  runs the pinned Underclass service and probe through the real collector, including monitor stop and
  restart. Tailnet HTTPS, bearer authorization and upstream provider completion remain separate gaps.
status: partial
