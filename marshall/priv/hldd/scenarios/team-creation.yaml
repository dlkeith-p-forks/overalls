  recorded under the teams scenario, with native physical recovery acceptance separate.
id: team-creation
journey: Create a team without claiming another account's active name
layers:
- identity
- authorization
- transport
preferred_gap: When a public archival journey exists, extend native browser coverage through name reuse;
  retain separate multi-node transfer/retirement testing.
scope: Native browser creation/refusal and fresh-name recovery, generated creation/retry/archival histories,
  and committed three-Marshall name collisions. SSH HTTP properties and packaged CLI assertions additionally
  inspect stable permanent refusals and pinned historical request identity. Campaign 015 separately checks
  the packaged standalone browser helper with pinned ty; recorded native execution retains its original
  source and scope.
status: partial
