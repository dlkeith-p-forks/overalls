boundary: Explicit current browser approval binds an in-memory secret digest to one actor and VM for one
  hour; every API checks current account/write access and exact thread binding, then ordinary model and
  guest execution fences apply.
denial: GET and digest URLs cannot approve/authenticate; stale sharing or browser login refuses approval.
  Existing CLI requests refuse withdrawn write access, retired account, deleted VM, expiry, foreign IDs
  or changed request payload. Browser sign-out alone does not revoke an independently approved CLI session.
