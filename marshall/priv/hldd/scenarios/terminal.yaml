boundary: Personal account allocation, boot-bound opening receipt, current creator/read-only attachment
  authority and PTY ownership.
denial: Reject stale login/session/execution authority, expired/foreign/replayed tickets and writable
  input after downgrade; do not replay uncertain input. A future output sequence closes the affected viewer
  channel instead of silently stalling it.
