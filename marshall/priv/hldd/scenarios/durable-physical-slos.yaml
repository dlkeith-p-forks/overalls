boundary: Compute owns transactional measurement admissions and retained numeric totals; authenticated
  physical outcomes and exact-execution readiness evidence supply observations without changing execution
  or receipt authority.
denial: Missing or late physical/readiness evidence cannot succeed; wrong-generation readiness cannot
  finish creation. Replayed admissions and scans cannot double-count. A measurement timeout must not release
  capacity, cancel work or replay provider effects.
