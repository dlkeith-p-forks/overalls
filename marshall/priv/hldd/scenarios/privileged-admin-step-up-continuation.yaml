boundary: A current stored login and persisted administrator role remain separate from a fixed fifteen-minute
  database-time passkey receipt. One five-minute socket-local continuation names the exact actor, login,
  route/resource binding, action and canonical arguments; current Cedar and domain preconditions decide
  the retried mutation. No-key setup keeps only an allowlisted Security return path and requires explicit
  resubmission.
denial: Refuse ordinary-user mutation, missing or stale role, absent or expired receipt, missing first-enrollment
  email freshness, failed or replayed ceremony, substituted arguments, another socket's continuation,
  invalid current resource/generation, revoked login, proving-key removal and elevated foreign Customer
  access. Staging and refused actions leave privileged mutation and target-action audit rows unchanged;
  failed assertions may consume their challenge, and successful verification retains its separate security
  audit even if target admission refuses.
