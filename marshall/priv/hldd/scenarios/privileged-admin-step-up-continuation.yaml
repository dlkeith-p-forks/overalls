gaps: Native expired target-page recovery, reconnect intent loss, argument substitution, stale-resource
  races, broader mutation families and elevated Customer isolation remain unexecuted in these journeys.
  Three serving replicas share one VM and PostgreSQL; hardware authenticators, independent physical hosts
  and rollout remain separate. Exact expiry arithmetic and a persisted 900-second interval do not establish
  a native899/900/901second timed journey. Mixed real-action property histories remain a preferred gap
  beyond timestamp arithmetic and fixed signed-assertion examples.
