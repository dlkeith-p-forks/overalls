boundary: Guest terminald owns raw scrollback and frame prefix parsing; boot authentication and shared
  session admission remain independent.
denial: Discarded scrollback cannot reappear after growth; incomplete headers cannot become frames and
  complete bad-magic or oversized headers refuse before payload arrival.
