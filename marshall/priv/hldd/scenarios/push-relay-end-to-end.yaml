boundary: Marshall signs the canonical SusanPoke body with its install identity and sends it over verified
  TLS to the compiled Susan origin; Susan verifies the domain-separated signature, opens the push key
  it issued and forwards only ciphertext, retrying provider 503s without a second send under the same
  delivery id.
denial: A stranger X25519 key cannot open the forwarded ciphertext; a provider 410 invalidates the device
  and later pokes drop as device_inactive; neither journal holds the push key, the device key, the route
  or a poke ciphertext.
