gaps: The new public/signed-in discovery links, positive marker and detector failure paths have no recorded
  real-browser setup-visibility journey yet. Firefox public-provider network, permanent signed/store installation,
  Android, deployed HTTPS downloads, extension-to-real-authentication/MFA/guest composition and production
  release acceptance remain unverified. Units cover bounded UI/documentation and packaging/action logic;
  the marker remains a spoofable presentation hint and no native property history has been executed for
  its permission lifecycle.
id: browser-launcher-distribution
journey: Find the browser extension guide, download an unsigned launcher and explicitly configure its
  server before a provider click
layers:
- identity
- authorization
- transport
- isolation
- storage
- recovery
preferred_gap: Add real-browser public and signed-in discovery-to-setup journeys for both Chrome and Firefox
  while retaining the unsigned/temporary-install limitations. Verify setup remains visible without the
  marker and hides only after a positive exact-origin signal, including denied/withdrawn permission and
  changed-origin recovery. Retain current native public downloads on both guest-family variants, compose
  the installed extension click with new-tab authentication/MFA and real guest checkout, and add generated
  extension settings/permission histories against an independent transmission oracle.
scope: Present controller/LiveView assertions inspect the canonical guide's two downloads, unsigned Chrome
  and temporary Firefox setup wording, public navigation and signed-in Overview CTA; no new real-browser
  discovery/setup execution is recorded. Recorded final strict typing/10 Node tests, deterministic minimized
  immutable package/check, real Chromium and exact immutable Firefox four-provider sentinel action clicks
  producing only origin/path launch URLs, unknown-URL click refusal, settings/metadata, developer/store
  byte equality and host immutable-download refusals. Exact-origin detector source and package assertions
  are being added; Chrome and Firefox setup-visibility runtime evidence remains pending. Firefox uses
  fixed local TLS/certificate bypass; installed-extension auth/guest composition and production downloads
  remain separate.
status: partial
