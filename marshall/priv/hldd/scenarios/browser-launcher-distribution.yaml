boundary: Public and signed-in navigation and Overview link to the canonical public /docs/browser-extension
  guide. Guidance grants no identity or compute authority. Marshall serves a closed artifact allowlist
  from a canonical immutable Nix-store package over its existing public HTTPS boundary without login state;
  operators may disable downloads while the guide remains public. Strict native modules transmit only
  provider origin/path after removing source queries/fragments, only after an explicit provider toolbar
  click to an explicitly configured origin. The configured extension requests optional access only for
  that exact Overalls origin and marks the open page with a local installed signal; Marshall uses that
  signal only to hide setup affordances. Public package possession and the marker grant no compute authority;
  the repository-launch scenario owns authenticated capture and admission.
denial: Disabled downloads, mutable/traversing roots, symlink root/bin/file, malformed descriptors, length
  mismatch, missing files and unknown artifacts return404. Missing or malformed server settings open options
  without transmitting. Known unsupported URLs disable the action. Withheld URLs preserve the explicit
  activeTab grant without transmitting; clicks validate the observed provider URL before opening Overalls.
  Source query/fragment fields are removed before transmission and URL user information refuses. Remote
  HTTP and credential-bearing server URLs refuse. Unsigned developer archives do not imply permanent Firefox
  installation. A denied or withdrawn exact-origin permission, failed registration, missing configuration
  or unavailable detector leaves setup visible; a spoofed marker never authorizes a request.
