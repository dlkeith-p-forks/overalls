boundary: hcloud hosts have exactly one ZFS zroot/root system disk, no guest storage, quota, KVM probe
  or Lilly, and no address literals (IPv4 by DHCP, IPv6 off); salopettes runs only Susan, its PostgreSQL
  and an nginx ACME proxy with public TCP 80/443 at the IPv4 address delivered by the shared fleet-addresses
  SOPS document.
denial: Two system disks, guest disks, a guest quota, Lilly budgets, a lilly section or static hcloud
  addresses are refused before planning; Lilly platforms still require working KVM in the guard; a missing
  or malformed address document keeps the public listener closed.
