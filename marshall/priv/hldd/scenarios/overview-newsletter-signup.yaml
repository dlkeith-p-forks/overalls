- assertion: successful Ghost responses produce a success without exposing request data
  execution: recorded
  kind: property
  path: marshall/test/marshall/newsletter_property_test.exs
  record: docs/architecture/reviews/2026-10-18-overview-newsletter.md
  record_assertion: focused Marshall run passed **40 tests**
  scope: Injected requester property checks safe success and the fixed subscription payload; no external
