gaps: Ghost availability, external receipt, and native browser journey remain unverified.
id: overview-newsletter-signup
journey: Subscribe to the newsletter or permanently dismiss the Overview invitation
layers:
- identity
- authorization
- storage
- recovery
preferred_gap: Run the authenticated browser journey against a controlled Ghost-compatible endpoint and
  record receipt without exposing mailbox or token data.
scope: Authenticated Overview account preference and server-side Ghost request boundary; local BEAM evidence
  does not establish external delivery.
