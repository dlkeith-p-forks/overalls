  execution: recorded
  kind: property
  path: marshall/test/marshall/newsletter_property_test.exs
  record: docs/architecture/reviews/2026-10-18-overview-newsletter.md
  record_assertion: focused Marshall run passed **40 tests**
  scope: Bounded Hegel invalid-input property rejects malformed mailboxes before the request boundary;
    no external delivery
- assertion: refute has_element?(view, "#overview-newsletter")
  execution: recorded
