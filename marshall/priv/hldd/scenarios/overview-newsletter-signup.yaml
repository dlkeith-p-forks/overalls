- assertion: Ghost and transport failures collapse to the safe unavailable result
  execution: recorded
  kind: property
  path: marshall/test/marshall/newsletter_property_test.exs
  record: docs/architecture/reviews/2026-10-18-overview-newsletter.md
  record_assertion: focused Marshall run passed **40 tests**
