gaps: An earlier NixOS fleet passed interactive SSH then failed a later agent-token case; another passed
  enrollment but refused clone relocation during Marshall unavailability. The strict reader-revision rerun
  passed the complete NixOS Porsche lifecycle subtest including relocation, clone and cleanup but failed
  the later terminal/browser stage amid Marshall database checkout timeouts. The reader-revision Ubuntu
  authenticated SSH journey passed login, account revocation and renewal, relocation, reboot and clone,
  with VM-test cleanup; its disposable fixture enabled readiness and templates, but did not assert an
  actual template hit or exact readiness journal. Production template producers were off at that historical
  reader boundary. Incoming author-reported activation and historical standby-source samples retain their
  separate scope; they do not establish a matched campaign or current independent deployment acceptance.
  The final typed focused NixOS Porsche lifecycle variant now passes on its captured pre-Starship images
  and fixtures; Ubuntu lifecycle and the separate complete clone fault matrix remain unrun. The first
  live benchmark canary failed direct SSH without Audi and its original deletion outlasted the runner
  deadline, then was independently confirmed cleaned. Two corrected readers-off production canaries passed
  client SSH and cleanup, not template-enabled readiness. A readers-off campaign passed ten sequential
  authenticated SSH samples per distribution but failed two of four concurrent creations with execution_failed;
  the failed run-owned VMs were independently confirmed deleted with released reservations and absent
  ZFS datasets using their preplanned deletion IDs. Sequential medians are exploratory, not an accepted
  matched baseline. The unrun Ubuntu Porsche lifecycle and separate complete clone fault matrix, delayed
  bootstrap/template-hit acceptance, complete concurrent baseline/enabled benchmark and independently
  observed current producer rollout remain. Current NixOS lifecycle evidence retains its captured pre-Starship
  scope. The formerly stuck baseline fixture is confirmed deleted. ADR-0143 offload, compressed same-host
  clones and deletion under pool writes pass native ZFS tests but lack post-deploy production measurement;
  compressed local clone throughput on real disks is unmeasured. ADR-0149 retires diagnostic ingestion/outbox/presentation;
  pre-cutover evidence is historical. Replacement native/property acceptance must execute separately.
  ADR-0177's two 26-create production bursts (with and without standbys) are recorded in the ADR; no machine
  test plants a leftover standby-* dataset to show the pool withheld natively.
id: provisioning-fastpath
journey: Create a machine and wait for its exact boot to become usable over SSH
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Storage tests use synthetic artifacts; execute the unrun Ubuntu Porsche lifecycle and separate
  complete clone fault matrix, plus delayed certificate/roster/SSH readiness, template-hit and stale-authority
  refusals. Current NixOS lifecycle evidence remains scoped to its captured pre-Starship runtime. The
  first four-way baseline failed two guarded ZFS observations; the prepared placement-bound stage diagnostic
  is not deployed and has not identified their precise cause. Before retrying, independently rebuild and
  compare the complete Ubuntu rootfs, manifest and NAR on both enrolled hosts after the sandboxed guest
  Nix DB normalization; the existing same-derivation output drift blocks an exact matched image offer.
  Keep the separate terminal fleet failure recorded until its database/browser cause is resolved. Execute
  the replacement independent-observability native and property scenarios; historical receipts cannot
  establish this cutover. Add a real contended image-lease/pool-lock periodic sweep retry that confirms
  retirement only after ownership is acquired, plus generated first-failure stage histories.
scope: Guarded provisioning journals, Rust/Hegel helper, native ZFS copy and template crash recovery.
  At the historical reader release, compatible readers and pool_id migration were deployed healthy on
  both hosts with producers off. Current declarations enable templates and block-cloned copies on both
  hosts, and every create copies its root disk on demand (ADR-0177 retired the earlier 128 standbys per
  image); incoming e3300040 reported production activation and samples from the standby configuration
  without independently captured deployment receipts. Two uncontrolled NixOS/Ubuntu SSH canaries confirmed
  run-owned cleanup through Audi. Source-inspected recurring template sweep schedules ten-minute retries
  through unchanged image-lease, pool-lock and native ownership refusals, with catalogued finite failure
  stages; periodic contention/retry has no newly recorded native or property execution.
status: partial
