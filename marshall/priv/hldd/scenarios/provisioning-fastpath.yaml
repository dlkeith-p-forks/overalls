boundary: A currently registered Porsche key and durable guest account enter the Audi proxy under strict
  host-CA trust. Host-local provisioning progress cannot grant launch authority; readiness binds the owned
  placement, epoch, generation and boot. A materialized file is independent of its template.
denial: Reject direct guest SSH bypass, stale boot receipts, deadline extension, corrupt journals, overwritten
  disks and unconfirmed storage cleanup; retain the original mutation ID through uncertain replies. Exact
  sealed identity changes refuse reuse; quarantined incarnations cannot regain readiness and require fenced
  retirement plus full verification of a distinct replacement.
