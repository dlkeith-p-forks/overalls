boundary: A current stored login permits ordinary access independently of a passkey. Single-use WebAuthn
  challenges establish session-specific privileged elevation. Browser magic-link GET leaves the single-use
  token intact; connected LiveView posts it with remember enabled.
denial: Reject expired/replayed challenges and revoke authority held by stale actors. Invalid or replayed
  magic links establish neither login nor remembered authority.
