gaps: Arguments remain caller-supplied until typed native effects replace the utility table. The peer
  cgroup check reads /proc after connect rather than through a pidfd. Lilly and hostd both run as root
  until the privilege drop.
id: hostd-lease-command-custody
journey: Hold every Lilly lease and leased utility in lilly-hostd until the holder releases it or dies
layers:
- authorization
- execution
- storage
- recovery
preferred_gap: A dedicated host-effects-custody machine test for wrong-peer refusal, BEAM SIGKILL mid-command
  and escaped descendants under cgroup custody.
scope: hostd library tests (decoder and lease-order Hegel properties, real-utility session custody) and
  Lilly lock tests against the real daemon. Unit tests use process-group custody; cgroup custody is exercised
  only by module-based NixOS machine tests.
