boundary: lilly-hostd holds each lease's flock on the existing lock inode, grants waiters in arrival order
  and runs leased utilities from a closed table with the lease descriptor inherited, each in its own command
  cgroup in production.
denial: No successor lease while a utility of the previous holder may run; no mutating utility without
  a lease; no second command on a busy lease; no session for a wrong uid, cgroup or protocol version.
