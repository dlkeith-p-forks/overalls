gaps: Editor and nested HTTPS moved to this path under ADR-0192 (staged-detached-ingress-survival). While
  Lilly is down no keeper runs, so a revoked execution's live session can last the downtime plus 30 s
  (Audi's key revocation is unaffected). The adoption grace is measured only on the test host. Until 2026-10-17
  Marshall refused SSH renewal while Lilly reconnected, so a session whose renewal fell in the restart
  window was cut despite its bridge; the recorded machine run's renewals missed that window, and no machine
  run yet forces a renewal into it.
id: detached-ingress-bridge-survival
journey: Keep a live guest SSH session through lilly-hostd and Lilly restarts while Lilly can still end
  it
layers:
