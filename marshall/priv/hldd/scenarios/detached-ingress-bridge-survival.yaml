boundary: ADR-0187. After guardian admission the BEAM sends Audi's accepted connection to hostd (op 14).
  hostd accepts only a connected AF_UNIX stream whose peer uid is Audi's, dials the guest in the VM namespace,
  and starts lilly-ingress-bridge --detached as lilly in its own lilly-ingress-<key>.scope in lilly_ingress.slice,
  outside lilly-hostd.service and lilly.service; the ready frame is written before any guest byte. Lilly
  records the binding under the key first, keeps an ingress guardian per bridge, and ends the bridge through
  hostd (op 16) when that guardian dies.
denial: hostd refuses a BridgeIngress descriptor that is not Audi's connected, non-listening AF_UNIX stream,
  a 1025th bridge or a reused key, and lists or kills only lilly-ingress-<32 hex>.scope cgroups in its
  slice. A restarted Lilly ends a live bridge without a readable record at once and a recorded one whose
  execution is not current within 30 s; a bridge hostd abandons before GO moves no byte. Marshall answers
  SSH renewal while Lilly reconnects with unavailable only after key, owner, write membership, VM state,
  generation and session checks, so key removal, revoked write access and a stop stay conclusive; admission
  still needs a live, reported host.
