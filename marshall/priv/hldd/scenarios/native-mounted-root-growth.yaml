boundary: A no-argument root helper derives the actual mounted pinned root and checks both GPT copies/CRCs,
  physical capacity, disk/partition GUIDs and starts before mutation. OmniOS additionally binds the assembly
  dataset/pool GUID and exactly one whole-disk vdev. Bootstrap requires a current volatile success receipt
  before network or identity.
denial: Refuse nonroot execution, caller-selected disks, foreign or shrinking layouts, invalid CRCs, extra
  partitions, substituted pool identity and failed native commands. Failure must withhold the root-growth
  receipt and bootstrap authority.
