scope: Twelve pure authority/GPT/receipt checks passed, with cross-target Clippy and twenty-binary linkage.
  Earlier offline QEMU and canonical-roots/SSH FreeBSD Firecracker growth passed. The final reviewed image
  5022d714, including blocking UFS flush, also passed three distinct clean boots with complete service
  oracles, two 2-GiB expansions, root bytes 5183107072 to 7268753408 to 9354403840, retained home data,
  exact GPT/nonroot identities, strict EFI inventories except bounded root NvVars, foreign-disk preservation
  and caller/nonroot refusals. OmniOS typed raw/whole-disk operand regression and corrected-kit native
  assembly passed. A host-direct diagnostic reproduced sliced refusal and unsliced success. The source-qualified
  OmniOS growth replay separately passed three complete service boots and two root expansions; interrupted
  expansion remains pending. Final OmniOS disk 45983bb7 passed three clean service boots with two expansions
  from 8 to 10 to 12 GiB, exact pinned pool/vdev and foreign-disk preservation. The promoted manifest
  minimum 16 GiB fleet launch remains separate.
