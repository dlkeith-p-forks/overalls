boundary: Marshall.Threads owns the durable objective, mode, team visibility and thread-to-machine binding.
  Compute owns VM admission/lifecycle and Agents owns turns, model calls and tools. PostgreSQL transactions,
  row locks, generation keys and Oban jobs coordinate durable thread changes. The authenticated LiveView
  is a client of these domains.
denial: Reject foreign or removed-team thread access, unsupported agent profiles, invalid machine shapes,
  changed duplicate idempotency input, prompts before readiness, stale authority during archive/delete/reopen,
  mismatched transcript bindings, and prompt or terminal mutation against archived machines. The resource
  and database require an explicit machine admission key; malformed unkeyed provisioning and archive jobs
  are cancelled. A stale provision job cannot resurrect a deleting or archived thread or overwrite a new
  machine generation. Replacement admission waits for physical cleanup.
