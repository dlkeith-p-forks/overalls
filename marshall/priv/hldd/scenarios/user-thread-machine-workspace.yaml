gaps: No native NixOS create/prompt/archive/reopen journey, generated worker-loss/idempotency history,
  multi-node recovery or broader production provider acceptance is recorded. The one deployed retry and
  its continuity through contraction do not prove native teardown, isolation or fault recovery. Previous-generation
  transcript selection and read-only retrieval are implemented and covered by focused tests, but native
  archive/reopen continuity remains unverified. The terminal link and lazy embedded disclosure are implemented;
  a persistent global thread rail, project filtering and activity ordering beyond the current authorized
  page remain separate work. Index search covers only the current authorized keyset page of at most 50
  threads; First page and Next page controls walk older authorized pages. Synthetic browser observations
  do not establish cross-device runtime acceptance.
id: user-thread-machine-workspace
journey: Create and recover a user thread with its dedicated machine
layers:
- identity
- authorization
- transport
- execution
- storage
- recovery
preferred_gap: Add an authenticated native create/prompt/archive/reopen journey, generated crash/deletion/admission
  histories and cross-node reconciliation. Add global thread navigation and project-scoped activity filtering
  if required, then exercise retained-generation revocation and binding checks across native archive/reopen
  before claiming complete lifecycle history continuity.
scope: The 2026-10-16 focused 117-case suite passed the new authorization, sharing and presentation assertions,
  including current role controls, registered-account sharing, bounded search and keyset pagination, initial
  skill selection, pending lifecycle actions, newest-first transcript/top composer and editor eligibility.
  The maintained browser probe passed 32 thread route/theme/viewport combinations plus expanded settings/sharing
  views and 36 collaborator combinations. Its synthetic lifecycle evidence is separate from native acceptance.
  All 32 focused tests passed for the source committed in 32624e1bf80df120beb69b923eee4362427aee23, covering
  modes, machine shapes, titles, team authorization, idempotency, prompt replay, lifecycle actions, retained
  transcripts and workspace states. Five lifecycle cases use injected deletion/readiness observations;
  five required-key cases cover resource/database enforcement, malformed-job refusal and stale archive
  generation fencing. Both hosts converged healthy on that contraction, and read-only SQL confirmed NOT
  NULL with zero null keys. One retry on expansion revision d5e03c080204a33a11b8c136e983593630e4fccf recovered
  the reported thread; inspection after contraction showed the same ready thread, running VM and completed
  initial turn, with one VM and one turn total. Native archive/reopen, cross-node recovery and physical
  isolation remain unverified.
status: partial
