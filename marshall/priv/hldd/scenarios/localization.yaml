boundary: Saved self-only locale override takes precedence over validated session/browser negotiation
  and English fallback. Arabic, Egyptian Arabic and Urdu use RTL; locale does not grant authority or change
  machine output. Public documentation is localized; authenticated handbook chapter titles, bodies and
  command-reference prose remain source English with LTR direction inside localized reader controls.
denial: Unsupported or malformed locale input cannot persist; a foreign user cannot change the preference;
  old Porsche protocol peers fall back to English; JSON fields, protocol identifiers and terminal bytes
  remain language-neutral.
