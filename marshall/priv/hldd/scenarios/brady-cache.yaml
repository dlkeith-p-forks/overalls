boundary: Verified origin and current profile admission precede shared-cache policy; explicit-public or
  reviewed anonymous full-commit GitHub classification, complete payloads, exact variants, freshness and
  process-owned leases govern reuse.
denial: Refuse private or conditional requests even when a public range is cached; never publish short,
  overflowing, aborted or owner-interrupted writes.
