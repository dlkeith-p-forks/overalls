gaps: Generated pressure inputs do not establish ZFS custody or kernel/TLS isolation. Native veth peers
  do not establish Firecracker attribution. Arbitrary power loss, disk-full/deletion failures, every HTTP
  parser combination remain separate. Earlier SSH interruptions and unresolved-attribution requests remain
  availability gaps; bounded receipt polling does not fix them. An earlier multi-GiB fill abandonment
  remains unexplained; the later full native pass and closed refusal diagnostics do not establish its
  resolution. A concurrent main activation interrupted an in-flight Ubuntu transfer (curl 18); connection
  survival across proxy restart remains separate.
id: brady-cache
journey: Resume a public download after interrupted cache publication or restart
layers:
- transport
- storage
- recovery
preferred_gap: Retain recorded native network/ZFS acceptance and generated Cache/Store histories. Extend
  native fault boundaries only when an uncovered production change requires them; preserve historical
  revision scope.
scope: Generated real Cache/Store file and process histories, independent full/range bytes, expiry, restart,
  synthetic pressure and refusal inventories; native HTTP/HTTPS ZFS recovery, real quota/headroom pressure
  and single-host production shared public HTTPS hits. Final native large matrix covers empty through
  256 MiB fixed/chunked bodies, second peer reuse, restart/offline full/ranges, sampled RSS, four concurrent
  reads plus a slow reader, sensitive/incomplete refusal and reduced native quota. Stale same-mount pressure
  retains reads while refusing writes until fresh recovery. Overalls real pinned nixpkgs independent-store
  flakes and a 318,532,502-byte LLVM archive have exact byte/NAR and current attributed cross-guest cache-hit
  evidence. The 2026-10-03 native extension passed full fixed/chunked delivery through 4 GiB + 1 byte,
  offline restart/ranges at 2^31/2^32 and four simultaneous 4 GiB readers with unchanged RSS bounds. Baseline
  live NixOS/Ubuntu acceptance at ef8e997f verified two 7,487,562,572-byte public checkpoint downloads
  each against independent pre/post SHA-256 references and exact current-owner/generation cache hits.
  Post-deployment b7e29b8f stable-post-4gib verified a new 7,487,562,572-byte NixOS publication then hit,
  two Ubuntu hits on that object and matching independent pre/post references.
status: partial
