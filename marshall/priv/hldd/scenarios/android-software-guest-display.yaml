  deployed Marshall/Lilly composition.
id: android-software-guest-display
journey: Select the Android software guest profile and attach a generation-bound display controller or
  viewer
layers:
- identity
- authorization
- transport
- execution
- isolation
- storage
- recovery
preferred_gap: Add a packaged Marshall/Lilly Firecracker browser journey covering readiness, controller/viewer
  and foreign/stale refusal, AVD retention and bounded recovery. Keep the recorded standalone API34 emulator,
  pure-property and production native evidence separate.
scope: Source-backed image codec, capability and in-memory relay boundaries, an independent generated
  lifecycle model, and a recorded standalone NixOS software-emulator run. Each bounded execution retains
  its own source and assertion scope; no native Firecracker display, real browser or production acceptance
  follows from the models or standalone fixture.
