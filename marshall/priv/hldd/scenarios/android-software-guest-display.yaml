boundary: The explicit linux-android-v1 declaration participates in version-4 image identity and projects
  Android SDK, ADB, emulator and display flags. ADR-0206 requires the NixOS Firecracker guest, software
  rendering, persistent AVD state and private ADB/display transport. Marshall checks login/ticket claims
  separately from its shared machine-and-generation relay; controller and viewer roles remain distinct.
  Source and pure models are not evidence that these layers compose in a native browser journey.
denial: Unsupported manifest versions, profiles, image kinds and malformed artifacts refuse Android qualification.
  Malformed tickets and mismatched machine, generation or mode refuse. The relay model refuses a second
  controller, stale-generation frames and input from a viewer. A future host output sequence closes its
  channel and notifies the generation-bound owner. Native expired-login, foreign-owner, stale-execution
  and transport refusal remain unverified as a composed journey.
